      owasp: "A02:2021"
      why: "Desactivar la verificación TLS permite que un intermediario suplante el servidor y lea o modifique el tráfico."
      fix_hint: "Restaura la validación de cadena y hostname; para certificados privados instala la CA confiable o fija una clave pública con un procedimiento de rotación."
    pattern: |
      &tls.Config{..., InsecureSkipVerify: true, ...}

  - id: ts-tls-verify-off
    languages: [javascript, typescript]
    severity: ERROR
    message: "rejectUnauthorized:false o NODE_TLS_REJECT_UNAUTHORIZED=0."
    metadata:
      pilar: seguridad
      cwe: "CWE-295"
      owasp: "A02:2021"
      why: "Desactivar la verificación TLS permite que un intermediario suplante el servidor y lea o modifique el tráfico."
      fix_hint: "Restaura la validación de cadena y hostname; para certificados privados instala la CA confiable o fija una clave pública con un procedimiento de rotación."
    pattern-either:
      - pattern: "{..., rejectUnauthorized: false, ...}"
      - pattern: process.env.NODE_TLS_REJECT_UNAUTHORIZED = "0"

  - id: java-tls-verify-off
    languages: [java]
    severity: ERROR
    message: "TrustManager o HostnameVerifier permisivo."
    metadata:
      pilar: seguridad
      cwe: "CWE-295"
      owasp: "A02:2021"
      why: "Desactivar la verificación TLS permite que un intermediario suplante el servidor y lea o modifique el tráfico."
      fix_hint: "Restaura la validación de cadena y hostname; para certificados privados instala la CA confiable o fija una clave pública con un procedimiento de rotación."
    pattern-either:
