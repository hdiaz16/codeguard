      fix_hint: "Restaura la validación de cadena y hostname; para certificados privados instala la CA confiable o fija una clave pública con un procedimiento de rotación."
    pattern-either:
      - pattern: ServicePointManager.ServerCertificateValidationCallback = ...
      - pattern: |
          new HttpClientHandler { ..., ServerCertificateCustomValidationCallback = ..., ... }

# ---------------------------------------------------------------------------
