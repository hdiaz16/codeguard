    metadata:
      pilar: seguridad
      cwe: "CWE-611"
      owasp: "A05:2021"
      why: "Aceptar DTD o entidades externas permite leer archivos locales, acceder a servicios internos y agotar recursos al analizar XML hostil."
      fix_hint: "Deshabilita DTD y resolución externa en la fábrica o usa un parser seguro; añade una prueba con una entidad externa que deba ser rechazada."
    pattern-either:
      - pattern: xml.etree.ElementTree.parse(...)
      - pattern: xml.etree.ElementTree.fromstring(...)
      - pattern: xml.dom.minidom.parse(...)
      - pattern: xml.sax.make_parser(...)
      - pattern: lxml.etree.XMLParser(..., resolve_entities=True, ...)

  - id: java-xxe
    languages: [java]
    severity: ERROR
    message: >-
      Factory XML sin desactivar DTD. Añade
      setFeature("http://apache.org/xml/features/disallow-doctype-decl", true).
    metadata:
      pilar: seguridad
      cwe: "CWE-611"
      owasp: "A05:2021"
      why: "Aceptar DTD o entidades externas permite leer archivos locales, acceder a servicios internos y agotar recursos al analizar XML hostil."
      fix_hint: "Deshabilita DTD y resolución externa en la fábrica o usa un parser seguro; añade una prueba con una entidad externa que deba ser rechazada."
    patterns:
      - pattern-either:
          - pattern: DocumentBuilderFactory.newInstance()
          - pattern: SAXParserFactory.newInstance()
          - pattern: XMLInputFactory.newInstance()
          - pattern: TransformerFactory.newInstance()
      - pattern-not-inside: |
          $F.setFeature("http://apache.org/xml/features/disallow-doctype-decl", true);
          ...

  - id: csharp-xxe
    languages: [csharp]
    severity: ERROR
    message: "DtdProcessing.Parse o XmlResolver activo permite XXE."
    metadata:
      pilar: seguridad
      cwe: "CWE-611"
      owasp: "A05:2021"
      why: "Aceptar DTD o entidades externas permite leer archivos locales, acceder a servicios internos y agotar recursos al analizar XML hostil."
      fix_hint: "Deshabilita DTD y resolución externa en la fábrica o usa un parser seguro; añade una prueba con una entidad externa que deba ser rechazada."
    pattern-either:
      - pattern: |
          new XmlReaderSettings { ..., DtdProcessing = DtdProcessing.Parse, ... }
      - pattern: $X.XmlResolver = new XmlUrlResolver()

# ---------------------------------------------------------------------------
# PATH TRAVERSAL / ZIP SLIP  (CWE-22)
# ---------------------------------------------------------------------------
  - id: python-zip-slip
    languages: [python]
    severity: ERROR
    message: >-
      extractall sobre un archivo no confiable permite escribir fuera del
      destino. Valida cada nombre de entrada contra el directorio base.
    metadata:
      pilar: seguridad
      cwe: "CWE-22"
      why: "Una ruta controlable puede escapar del directorio previsto y sobrescribir o leer archivos accesibles por el proceso."
      fix_hint: "Resuelve y normaliza la ruta final, comprueba que permanezca dentro del directorio base con semántica de ruta y rechaza nombres absolutos o con traversal."
    pattern-either:
      - pattern: $Z.extractall(...)
      - pattern: $T.extractall(...)

  - id: java-zip-slip
    languages: [java]
    severity: ERROR
    message: "Nombre de entrada del ZIP usado como ruta sin normalizar (Zip Slip)."
    metadata:
      pilar: seguridad
      cwe: "CWE-22"
      why: "Una ruta controlable puede escapar del directorio previsto y sobrescribir o leer archivos accesibles por el proceso."
      fix_hint: "Resuelve y normaliza la ruta final, comprueba que permanezca dentro del directorio base con semántica de ruta y rechaza nombres absolutos o con traversal."
    pattern-either:
      - pattern: new File($DIR, $ENTRY.getName())
      - pattern: Paths.get($DIR, $ENTRY.getName())
      - pattern: new FileOutputStream($DIR + $ENTRY.getName())

  - id: go-zip-slip
    languages: [go]
    severity: ERROR
    message: "Nombre de entrada del archivo comprimido usado sin validar (Zip Slip)."
    metadata:
      pilar: seguridad
      cwe: "CWE-22"
      why: "Una ruta controlable puede escapar del directorio previsto y sobrescribir o leer archivos accesibles por el proceso."
      fix_hint: "Resuelve y normaliza la ruta final, comprueba que permanezca dentro del directorio base con semántica de ruta y rechaza nombres absolutos o con traversal."
    pattern-either:
      - pattern: filepath.Join($DST, $F.Name)
      - pattern: filepath.Join($DST, $HDR.Name)

  - id: ts-path-traversal
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      Ruta construida con entrada externa. Normaliza y verifica que el
      resultado siga dentro del directorio base.
    metadata:
      pilar: seguridad
      cwe: "CWE-22"
      why: "Una ruta controlable puede escapar del directorio previsto y sobrescribir o leer archivos accesibles por el proceso."
      fix_hint: "Resuelve y normaliza la ruta final, comprueba que permanezca dentro del directorio base con semántica de ruta y rechaza nombres absolutos o con traversal."
    pattern-either:
      - pattern: fs.$M(path.join($BASE, $REQ.params.$P), ...)
      - pattern: fs.$M(path.join($BASE, $REQ.query.$P), ...)
      - pattern: fs.$M($BASE + $REQ.$X.$P, ...)

# ---------------------------------------------------------------------------
# DEBUG / CONFIGURACIÓN INSEGURA EN PRODUCCIÓN  (CWE-489)
# ---------------------------------------------------------------------------
  - id: python-debug-en-prod
    languages: [python]
    severity: ERROR
    message: "Modo debug activo expone stack traces y consola remota."
    metadata:
      pilar: seguridad
      cwe: "CWE-489"
      owasp: "A05:2021"
      why: "Las opciones de desarrollo exponen detalles internos y, en algunos frameworks, consolas o acciones peligrosas accesibles remotamente."
      fix_hint: "Fija el modo de producción desde configuración validada al arrancar y falla de forma segura si debug o stack traces quedan activos fuera del entorno local."
    pattern-either:
      - pattern: $APP.run(..., debug=True, ...)
      - pattern: DEBUG = True
      - pattern: app.config["DEBUG"] = True

