# =============================================================================
# PILAR SEGURIDAD
# severity: ERROR = bloquea | WARNING = aviso
# Criterio de severidad: si la consecuencia es RCE, XSS, fuga de datos
# personales o bypass de autenticación -> ERROR. Si es higiene -> WARNING.
# =============================================================================
rules:

# ---------------------------------------------------------------------------
# INYECCIÓN SQL  (CWE-89) — replica de go-sql-concat al resto de lenguajes
# ---------------------------------------------------------------------------
  - id: python-sql-concat
    languages: [python]
    severity: ERROR
    message: >-
      SQL construido por interpolación. Usa consulta parametrizada:
      cursor.execute("... WHERE id = %s", (valor,))
    metadata:
      pilar: seguridad
      cwe: "CWE-89"
      owasp: "A03:2021"
      why: "Concatenar entrada en SQL permite alterar la estructura de la consulta, leer o modificar datos y eludir controles de autorización."
      fix_hint: "Usa parámetros enlazados por el driver para todos los valores; para nombres de tabla o columna aplica una lista cerrada de identificadores permitidos."
    patterns:
      - pattern-either:
          - pattern: $CUR.execute("..." % ...)
          - pattern: $CUR.execute("..." + $X)
          - pattern: $CUR.execute("...".format(...))
          - pattern: $CUR.execute(f"...{$X}...")
          - pattern: $CUR.executemany(f"...{$X}...")
          - pattern: $DB.raw(f"...{$X}...")
          - pattern: sqlalchemy.text(f"...{$X}...")
      - pattern-not: $CUR.execute("...", ...)

  - id: ts-sql-concat
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      SQL construido por interpolación. Usa placeholders ($1, ?) y pasa los
      valores como segundo argumento.
    metadata:
      pilar: seguridad
      cwe: "CWE-89"
      owasp: "A03:2021"
      why: "Concatenar entrada en SQL permite alterar la estructura de la consulta, leer o modificar datos y eludir controles de autorización."
      fix_hint: "Usa parámetros enlazados por el driver para todos los valores; para nombres de tabla o columna aplica una lista cerrada de identificadores permitidos."
    # curación 2026-08-11 (lo destapó el corpus de --test): la metavariable-
    # regex de $M en AND mataba las alternativas que no ligan $M (las de
    # query/execute/raw explícitos y la concatenación con +), y el pattern-not
    # con `...` matcheaba también plantillas CON interpolación, anulando la
    # forma query sin argumentos extra. Cada alternativa lleva ahora su propio
    # filtro de $M; la llamada parametrizada sana (plantilla sin ${}) no
    # matchea el patrón positivo, así que no necesita exención.
    patterns:
      - pattern-either:
          - patterns:
              - pattern: $DB.$M(`...${$X}...`, ...)
              - metavariable-regex:
                  metavariable: $M
                  regex: ^(query|execute|raw|unsafe)$
          - patterns:
              - pattern: $DB.$M("..." + $X, ...)
              - metavariable-regex:
                  metavariable: $M
                  regex: ^(query|execute|raw|unsafe)$

  - id: java-sql-concat
    languages: [java]
    severity: ERROR
    message: >-
      SQL construido por concatenación. Usa PreparedStatement con placeholders.
    metadata:
      pilar: seguridad
      cwe: "CWE-89"
      owasp: "A03:2021"
      why: "Concatenar entrada en SQL permite alterar la estructura de la consulta, leer o modificar datos y eludir controles de autorización."
      fix_hint: "Usa parámetros enlazados por el driver para todos los valores; para nombres de tabla o columna aplica una lista cerrada de identificadores permitidos."
    pattern-either:
      - pattern: $STMT.executeQuery("..." + $X)
      - pattern: $STMT.executeUpdate("..." + $X)
      - pattern: $STMT.execute("..." + $X)
      - pattern: $CONN.prepareStatement("..." + $X)
      - pattern: String.format("...SELECT...", ...)

  - id: csharp-sql-concat
    languages: [csharp]
    severity: ERROR
    message: >-
      SQL construido por concatenación o interpolación. Usa SqlParameter.
    metadata:
      pilar: seguridad
      cwe: "CWE-89"
      owasp: "A03:2021"
      why: "Concatenar entrada en SQL permite alterar la estructura de la consulta, leer o modificar datos y eludir controles de autorización."
      fix_hint: "Usa parámetros enlazados por el driver para todos los valores; para nombres de tabla o columna aplica una lista cerrada de identificadores permitidos."
    pattern-either:
      - pattern: new SqlCommand("..." + $X, ...)
      - pattern: new SqlCommand($"...{$X}...", ...)
      - pattern: new NpgsqlCommand($"...{$X}...", ...)
      - pattern: $CTX.Database.ExecuteSqlRaw("..." + $X, ...)
      - pattern: $CTX.$SET.FromSqlRaw($"...{$X}...", ...)

# ---------------------------------------------------------------------------
# INYECCIÓN DE COMANDOS  (CWE-78) — replica de python-subprocess-shell
# ---------------------------------------------------------------------------
  - id: ts-command-injection
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      exec/execSync interpreta shell. Usa execFile o spawn con array de
      argumentos, nunca una cadena construida.
    metadata:
      pilar: seguridad
      cwe: "CWE-78"
      owasp: "A03:2021"
      why: "Una cadena controlable ejecutada por un intérprete permite inyectar operadores y comandos con los privilegios del proceso."
      fix_hint: "Evita el shell, fija el ejecutable como literal y pasa cada argumento mediante la API estructurada; valida con una lista permitida cuando el comando sea variable."
    pattern-either:
      - pattern: $CP.exec(`...${$X}...`, ...)
      - pattern: $CP.exec("..." + $X, ...)
      - pattern: $CP.execSync(`...${$X}...`, ...)
      - pattern: $CP.execSync("..." + $X, ...)
      - pattern: '$CP.spawn(..., {..., shell: true, ...})'

  - id: go-command-injection
    languages: [go]
    severity: ERROR
    message: >-
      exec.Command invocando shell o con binario dinámico. Pasa el binario
      literal y los argumentos por separado.
    metadata:
      pilar: seguridad
      cwe: "CWE-78"
      owasp: "A03:2021"
      why: "Una cadena controlable ejecutada por un intérprete permite inyectar operadores y comandos con los privilegios del proceso."
      fix_hint: "Evita el shell, fija el ejecutable como literal y pasa cada argumento mediante la API estructurada; valida con una lista permitida cuando el comando sea variable."
    pattern-either:
      - pattern: exec.Command("sh", "-c", $X)
      - pattern: exec.Command("bash", "-c", $X)
      - pattern: exec.CommandContext($CTX, "sh", "-c", $X)
      - pattern: exec.Command(fmt.Sprintf("...", ...), ...)

  - id: java-command-injection
    languages: [java]
    severity: ERROR
    message: >-
      Runtime.exec / ProcessBuilder con cadena construida. Usa ProcessBuilder
      con lista de argumentos literales.
    metadata:
      pilar: seguridad
      cwe: "CWE-78"
      owasp: "A03:2021"
      why: "Una cadena controlable ejecutada por un intérprete permite inyectar operadores y comandos con los privilegios del proceso."
      fix_hint: "Evita el shell, fija el ejecutable como literal y pasa cada argumento mediante la API estructurada; valida con una lista permitida cuando el comando sea variable."
    pattern-either:
      - pattern: Runtime.getRuntime().exec("..." + $X)
      - pattern: Runtime.getRuntime().exec($X)
      - pattern: new ProcessBuilder("sh", "-c", $X)
      - pattern: new ProcessBuilder("cmd.exe", "/c", $X)

  - id: csharp-command-injection
    languages: [csharp]
    severity: ERROR
    message: >-
      Process.Start con UseShellExecute o argumentos interpolados.
      Usa ArgumentList con valores separados.
    metadata:
      pilar: seguridad
      cwe: "CWE-78"
      owasp: "A03:2021"
      why: "Una cadena controlable ejecutada por un intérprete permite inyectar operadores y comandos con los privilegios del proceso."
      fix_hint: "Evita el shell, fija el ejecutable como literal y pasa cada argumento mediante la API estructurada; valida con una lista permitida cuando el comando sea variable."
    pattern-either:
      - pattern: |
          new ProcessStartInfo { ..., UseShellExecute = true, ... }
      - pattern: Process.Start("cmd.exe", $"...{$X}...")
      - pattern: Process.Start("/bin/sh", $"...{$X}...")

# ---------------------------------------------------------------------------
# DESERIALIZACIÓN INSEGURA  (CWE-502) — el hueco grande de Java
# ---------------------------------------------------------------------------
  - id: java-unsafe-deserialization
    languages: [java]
    severity: ERROR
    message: >-
      Deserialización insegura. ObjectInputStream sobre datos no confiables es
      RCE directa. Jackson con default typing y SnakeYAML sin SafeConstructor,
      igual.
    metadata:
      pilar: seguridad
      cwe: "CWE-502"
      owasp: "A08:2021"
      why: "Los formatos que reconstruyen tipos u objetos pueden invocar código o gadgets durante la deserialización de contenido no confiable."
      fix_hint: "Usa un formato de datos sin ejecución como JSON o Protobuf, valida el esquema y limita tamaño y profundidad antes de procesarlo."
    pattern-either:
      - pattern: new ObjectInputStream(...).readObject()
      - pattern: $OIS.readObject()
      - pattern: $MAPPER.enableDefaultTyping(...)
      - pattern: $MAPPER.activateDefaultTyping(...)
      - pattern: new Yaml()
      - pattern: new XStream(...)

  - id: python-pickle-load
    languages: [python]
    severity: ERROR   # SUBIDO desde aviso: pickle sobre datos externos es RCE
    message: >-
      pickle sobre datos no confiables es ejecución remota de código.
      Usa JSON, MessagePack o Protobuf.
    metadata:
      pilar: seguridad
      cwe: "CWE-502"
      owasp: "A08:2021"
      why: "Los formatos que reconstruyen tipos u objetos pueden invocar código o gadgets durante la deserialización de contenido no confiable."
      fix_hint: "Usa un formato de datos sin ejecución como JSON o Protobuf, valida el esquema y limita tamaño y profundidad antes de procesarlo."
    pattern-either:
      - pattern: pickle.load(...)
      - pattern: pickle.loads(...)
      - pattern: cPickle.loads(...)
      - pattern: dill.loads(...)
      - pattern: joblib.load(...)
      - pattern: torch.load($X)
      - pattern: shelve.open(...)

  - id: ts-unsafe-deserialization
    languages: [javascript, typescript]
    severity: ERROR
    message: "node-serialize.unserialize sobre entrada externa es RCE."
    metadata:
      pilar: seguridad
      cwe: "CWE-502"
      why: "Los formatos que reconstruyen tipos u objetos pueden invocar código o gadgets durante la deserialización de contenido no confiable."
      fix_hint: "Usa un formato de datos sin ejecución como JSON o Protobuf, valida el esquema y limita tamaño y profundidad antes de procesarlo."
    pattern-either:
      - pattern: $S.unserialize(...)
      - pattern: require('node-serialize')

# ---------------------------------------------------------------------------
# JWT SIN VERIFICAR FIRMA  (CWE-347) — replica de ts-jwt-decode-no-verify
# ---------------------------------------------------------------------------
  - id: python-jwt-no-verify
    languages: [python]
    severity: ERROR
    message: >-
      JWT decodificado sin verificar firma. Cualquiera puede fabricar el token.
    metadata:
      pilar: seguridad
      cwe: "CWE-347"
      owasp: "A01:2021"
      why: "Leer claims sin verificar firma, algoritmo, emisor y audiencia permite que un atacante fabrique una identidad o privilegios."
      fix_hint: "Valida la firma con una clave confiable y fija explícitamente algoritmos, issuer, audience y expiración antes de utilizar cualquier claim."
    pattern-either:
      - pattern: jwt.decode(..., verify=False, ...)
      - pattern: 'jwt.decode(..., options={..., "verify_signature": False, ...}, ...)'
      - pattern: jwt.get_unverified_header(...)
      - pattern: jwt.get_unverified_claims(...)

  - id: go-jwt-no-verify
    languages: [go]
    severity: ERROR
    message: "ParseUnverified no valida la firma del token."
    metadata:
      pilar: seguridad
      cwe: "CWE-347"
      owasp: "A01:2021"
      why: "Leer claims sin verificar firma, algoritmo, emisor y audiencia permite que un atacante fabrique una identidad o privilegios."
      fix_hint: "Valida la firma con una clave confiable y fija explícitamente algoritmos, issuer, audience y expiración antes de utilizar cualquier claim."
    pattern-either:
      - pattern: $P.ParseUnverified(...)
      - pattern: jwt.ParseUnverified(...)

  - id: java-jwt-no-verify
    languages: [java]
    severity: ERROR
    message: "parseClaimsJwt / JWT.decode no verifican firma. Usa parseClaimsJws."
    metadata:
      pilar: seguridad
      cwe: "CWE-347"
      owasp: "A01:2021"
      why: "Leer claims sin verificar firma, algoritmo, emisor y audiencia permite que un atacante fabrique una identidad o privilegios."
      fix_hint: "Valida la firma con una clave confiable y fija explícitamente algoritmos, issuer, audience y expiración antes de utilizar cualquier claim."
    pattern-either:
      - pattern: $P.parseClaimsJwt(...)
      - pattern: $P.parsePlaintextJwt(...)
      - pattern: JWT.decode(...)

  - id: csharp-jwt-no-verify
    languages: [csharp]
    severity: ERROR
    message: "Validación de firma o de emisor desactivada en TokenValidationParameters."
    metadata:
      pilar: seguridad
      cwe: "CWE-347"
      owasp: "A01:2021"
      why: "Leer claims sin verificar firma, algoritmo, emisor y audiencia permite que un atacante fabrique una identidad o privilegios."
      fix_hint: "Valida la firma con una clave confiable y fija explícitamente algoritmos, issuer, audience y expiración antes de utilizar cualquier claim."
    pattern-either:
      - pattern: |
          new TokenValidationParameters { ..., ValidateIssuerSigningKey = false, ... }
      - pattern: |
          new TokenValidationParameters { ..., RequireSignedTokens = false, ... }
      - pattern: $H.ReadJwtToken(...)

# ---------------------------------------------------------------------------
# EVAL / EJECUCIÓN DINÁMICA  (CWE-95) — faltaba en Java y C#
# ---------------------------------------------------------------------------
  - id: java-dynamic-eval
    languages: [java]
    severity: ERROR
    message: "Ejecución de código dinámico (ScriptEngine / Nashorn / OGNL / SpEL)."
    metadata:
      pilar: seguridad
      cwe: "CWE-95"
      why: "Evaluar texto como código convierte cualquier dato controlable en ejecución con los privilegios de la aplicación."
      fix_hint: "Sustituye la evaluación por un parser o una tabla cerrada de operaciones; si el caso es inevitable, aísla el intérprete y acepta sólo una gramática limitada."
    pattern-either:
      - pattern: $ENGINE.eval(...)
      - pattern: new SpelExpressionParser().parseExpression($X)
      - pattern: Ognl.getValue(...)

  - id: csharp-dynamic-eval
    languages: [csharp]
    severity: ERROR
    message: "Compilación o evaluación de código en tiempo de ejecución."
    metadata:
      pilar: seguridad
      cwe: "CWE-95"
      why: "Evaluar texto como código convierte cualquier dato controlable en ejecución con los privilegios de la aplicación."
      fix_hint: "Sustituye la evaluación por un parser o una tabla cerrada de operaciones; si el caso es inevitable, aísla el intérprete y acepta sólo una gramática limitada."
    pattern-either:
      - pattern: CSharpScript.EvaluateAsync(...)
      - pattern: CSharpScript.RunAsync(...)
      - pattern: $C.CompileAssemblyFromSource(...)

# ---------------------------------------------------------------------------
# CRIPTOGRAFÍA DÉBIL  (CWE-327 / CWE-916)
# ---------------------------------------------------------------------------
  - id: python-crypto-debil
    languages: [python]
    severity: ERROR
    message: >-
      Algoritmo o modo débil. Hash de contraseñas -> Argon2id o bcrypt.
      Cifrado -> AES-GCM. Nunca MD5, SHA-1, DES ni modo ECB.
    metadata:
      pilar: seguridad
      cwe: "CWE-327"
      owasp: "A02:2021"
      why: "Algoritmos obsoletos o modos sin autenticación permiten colisiones, recuperación o modificación silenciosa de datos protegidos."
      fix_hint: "Usa primitivas de alto nivel mantenidas: Argon2id o bcrypt para contraseñas, SHA-256 o superior para integridad y cifrado autenticado como AES-GCM con nonces únicos."
    pattern-either:
      - pattern: hashlib.md5(...)
      - pattern: hashlib.sha1(...)
      - pattern: hashlib.new("md5", ...)
      - pattern: Crypto.Cipher.DES.new(...)
      - pattern: DES.new(...)
      - pattern: ARC4.new(...)
      - pattern: $C.new($K, AES.MODE_ECB, ...)
      - pattern: modes.ECB(...)

  - id: ts-crypto-debil
    languages: [javascript, typescript]
    severity: ERROR
    message: "Algoritmo o modo débil. Usa sha256+ y AES-GCM."
    metadata:
      pilar: seguridad
      cwe: "CWE-327"
      owasp: "A02:2021"
      why: "Algoritmos obsoletos o modos sin autenticación permiten colisiones, recuperación o modificación silenciosa de datos protegidos."
      fix_hint: "Usa primitivas de alto nivel mantenidas: Argon2id o bcrypt para contraseñas, SHA-256 o superior para integridad y cifrado autenticado como AES-GCM con nonces únicos."
    patterns:
      - pattern-either:
          - pattern: crypto.createHash("$ALGO")
          - pattern: crypto.createCipheriv("$ALGO", ...)
          - pattern: crypto.createDecipheriv("$ALGO", ...)
      - metavariable-regex:
          metavariable: $ALGO
          regex: (?i)(md5|md4|sha1|rc4|des|.*-ecb)

  - id: go-crypto-debil
    languages: [go]
    severity: ERROR
    message: "Algoritmo o modo débil. Usa sha256+, AES-GCM y bcrypt/argon2."
    metadata:
      pilar: seguridad
      cwe: "CWE-327"
      owasp: "A02:2021"
      why: "Algoritmos obsoletos o modos sin autenticación permiten colisiones, recuperación o modificación silenciosa de datos protegidos."
      fix_hint: "Usa primitivas de alto nivel mantenidas: Argon2id o bcrypt para contraseñas, SHA-256 o superior para integridad y cifrado autenticado como AES-GCM con nonces únicos."
    pattern-either:
      - pattern: md5.New()
      - pattern: md5.Sum(...)
      - pattern: sha1.New()
      - pattern: sha1.Sum(...)
      - pattern: des.NewCipher(...)
      - pattern: rc4.NewCipher(...)
      - pattern: cipher.NewCBCEncrypter(...)

  - id: java-crypto-debil
    languages: [java]
    severity: ERROR
    message: "Algoritmo o modo débil. AES/GCM/NoPadding y SHA-256 como mínimo."
    metadata:
      pilar: seguridad
      cwe: "CWE-327"
      owasp: "A02:2021"
      why: "Algoritmos obsoletos o modos sin autenticación permiten colisiones, recuperación o modificación silenciosa de datos protegidos."
      fix_hint: "Usa primitivas de alto nivel mantenidas: Argon2id o bcrypt para contraseñas, SHA-256 o superior para integridad y cifrado autenticado como AES-GCM con nonces únicos."
    patterns:
      - pattern-either:
          - pattern: MessageDigest.getInstance("$ALGO")
          - pattern: Cipher.getInstance("$ALGO")
          - pattern: KeyGenerator.getInstance("$ALGO")
      - metavariable-regex:
          metavariable: $ALGO
          regex: (?i)(md5|md2|sha-?1|des|rc2|rc4|blowfish|.*ecb.*|aes$|aes/ecb.*)

  - id: csharp-crypto-debil
    languages: [csharp]
    severity: ERROR
    message: "Algoritmo o modo débil. Usa SHA256+, AesGcm y Rfc2898/Argon2."
    metadata:
      pilar: seguridad
      cwe: "CWE-327"
      owasp: "A02:2021"
      why: "Algoritmos obsoletos o modos sin autenticación permiten colisiones, recuperación o modificación silenciosa de datos protegidos."
      fix_hint: "Usa primitivas de alto nivel mantenidas: Argon2id o bcrypt para contraseñas, SHA-256 o superior para integridad y cifrado autenticado como AES-GCM con nonces únicos."
    pattern-either:
      - pattern: MD5.Create()
      - pattern: SHA1.Create()
      - pattern: DES.Create()
      - pattern: TripleDES.Create()
      - pattern: RC2.Create()
      - pattern: $X.Mode = CipherMode.ECB

# ---------------------------------------------------------------------------
# ALEATORIEDAD NO CRIPTOGRÁFICA  (CWE-338)
# Se dispara solo cuando el destino tiene nombre de material sensible.
# ---------------------------------------------------------------------------
  - id: python-random-inseguro
    languages: [python]
    severity: ERROR
    message: >-
      random no es criptográficamente seguro. Para tokens, nonces, OTP o
      identificadores impredecibles usa el módulo secrets.
    metadata:
      pilar: seguridad
      cwe: "CWE-338"
      owasp: "A02:2021"
      why: "Los generadores no criptográficos son predecibles y permiten adivinar tokens, nonces, códigos o identificadores sensibles."
      fix_hint: "Obtén cada valor sensible de la API criptográfica del sistema, usa suficiente entropía y no reutilices semillas ni nonces."
    patterns:
      - pattern-either:
          - pattern: $VAR = random.$F(...)
          - pattern: $VAR = random.$F(...).$ANY(...)
      - metavariable-regex:
          metavariable: $VAR
          regex: (?i).*(token|secret|key|passw|nonce|salt|otp|session|csrf|reset|api_?key|uuid).*

  - id: ts-random-inseguro
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      Math.random no es seguro. Usa crypto.randomUUID o crypto.randomBytes.
    metadata:
      pilar: seguridad
      cwe: "CWE-338"
      owasp: "A02:2021"
      why: "Los generadores no criptográficos son predecibles y permiten adivinar tokens, nonces, códigos o identificadores sensibles."
      fix_hint: "Obtén cada valor sensible de la API criptográfica del sistema, usa suficiente entropía y no reutilices semillas ni nonces."
    patterns:
      - pattern-either:
          - pattern: const $VAR = <... Math.random() ...>
          - pattern: let $VAR = <... Math.random() ...>
          - pattern: $VAR = <... Math.random() ...>
      - metavariable-regex:
          metavariable: $VAR
          regex: (?i).*(token|secret|key|passw|nonce|salt|otp|session|csrf|reset|apiKey|id)$

  - id: go-random-inseguro
    languages: [go]
    severity: ERROR
    message: "math/rand no es seguro. Usa crypto/rand para material sensible."
    metadata:
      pilar: seguridad
      cwe: "CWE-338"
      owasp: "A02:2021"
      why: "Los generadores no criptográficos son predecibles y permiten adivinar tokens, nonces, códigos o identificadores sensibles."
      fix_hint: "Obtén cada valor sensible de la API criptográfica del sistema, usa suficiente entropía y no reutilices semillas ni nonces."
    patterns:
      - pattern-either:
          - pattern: $VAR := rand.$F(...)
          - pattern: $VAR = rand.$F(...)
      - metavariable-regex:
          metavariable: $VAR
          regex: (?i).*(token|secret|key|passw|nonce|salt|otp|session|csrf|reset).*

  - id: java-random-inseguro
    languages: [java]
    severity: WARNING  # curación: sin filtro por nombre sensible (como sus hermanos), ERROR sería ruido
    message: "java.util.Random no es seguro. Usa SecureRandom."
    metadata:
      pilar: seguridad
      cwe: "CWE-338"
      owasp: "A02:2021"
      why: "Los generadores no criptográficos son predecibles y permiten adivinar tokens, nonces, códigos o identificadores sensibles."
      fix_hint: "Obtén cada valor sensible de la API criptográfica del sistema, usa suficiente entropía y no reutilices semillas ni nonces."
    pattern-either:
      - pattern: new Random()
      - pattern: Math.random()
      - pattern: ThreadLocalRandom.current()

  - id: csharp-random-inseguro
    languages: [csharp]
    severity: ERROR
    message: "System.Random no es seguro. Usa RandomNumberGenerator."
    metadata:
      pilar: seguridad
      cwe: "CWE-338"
      owasp: "A02:2021"
      why: "Los generadores no criptográficos son predecibles y permiten adivinar tokens, nonces, códigos o identificadores sensibles."
      fix_hint: "Obtén cada valor sensible de la API criptográfica del sistema, usa suficiente entropía y no reutilices semillas ni nonces."
    pattern-either:
      - pattern: new Random()
      - pattern: Random.Shared.$F(...)

# ---------------------------------------------------------------------------
# VERIFICACIÓN TLS DESACTIVADA  (CWE-295)
# ---------------------------------------------------------------------------
  - id: python-tls-verify-off
    languages: [python]
    severity: ERROR
    message: "Verificación de certificado desactivada. Habilita MITM."
    metadata:
      pilar: seguridad
      cwe: "CWE-295"
      owasp: "A02:2021"
      why: "Desactivar la verificación TLS permite que un intermediario suplante el servidor y lea o modifique el tráfico."
      fix_hint: "Restaura la validación de cadena y hostname; para certificados privados instala la CA confiable o fija una clave pública con un procedimiento de rotación."
    pattern-either:
      - pattern: requests.$M(..., verify=False, ...)
      - pattern: httpx.$M(..., verify=False, ...)
      - pattern: ssl._create_unverified_context(...)
      - pattern: $CTX.check_hostname = False
      - pattern: $CTX.verify_mode = ssl.CERT_NONE

  - id: go-tls-verify-off
    languages: [go]
    severity: ERROR
    message: "InsecureSkipVerify desactiva la validación del certificado."
    metadata:
