<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>DUNA — los cinco estados</title>
<style>
  body {
    margin: 0; min-height: 100vh; background: #16110e;
    font-family: "Segoe UI", sans-serif; color: #d9cbc0;
    display: flex; flex-direction: column; align-items: center;
    padding: 30px 16px 40px;
  }
  h1 { font-weight: 300; font-size: 20px; margin: 0 0 4px; }
  p.sub { margin: 0 0 24px; color: #8d7f74; font-size: 13px; }
  .grid { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; }
  .cell {
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    background: #1d1713; border-radius: 20px; padding: 18px 20px 14px;
  }
  .cell b { font-size: 14px; color: #efe3d9; font-weight: 600; }
  .cell span { font-size: 11.5px; color: #a08f82; max-width: 200px; text-align: center; }
  canvas { width: 200px; height: 200px; }
</style>
</head>
<body>
  <h1>DUNA — una animación distinta por estado</h1>
  <p class="sub">El nivel del líquido cuenta la historia: vacío → medio → hirviendo → lleno → agitado.</p>
  <div class="grid" id="grid"></div>

<script>
const hex = h => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
const lerp = (x,y,t) => x + (y-x)*t;
const lerp3 = (u,v,t) => [lerp(u[0],v[0],t), lerp(u[1],v[1],t), lerp(u[2],v[2],t)];
const css = (c,a=1) => `rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;

// ── parámetros por estado ────────────────────────────────────────────────
//   glass = tinte del cristal vacío · liq = líquido · deep = capa profunda
//   level = qué tan llena (0-1) · amp/spd = oleaje · extras por estado
const STATES = {
  idle: {
    title: "idle", desc: "medio llena, olas serenas — respira",
    glass: "#ffe9dd", liq: "#e2896b", deep: "#b45a40",
    level: .48, amp: .045, spd: .55, breathe: .035,
  },
  working: {
    title: "working", desc: "hierve suave: olas vivas y burbujas subiendo",
    glass: "#fff0d4", liq: "#e8a13d", deep: "#c07818",
    level: .55, amp: .11, spd: 1.9, breathe: .02, bubbles: true, slosh: .05,
  },
  pass: {
    title: "pass", desc: "se llena hasta el borde y queda en calma",
    glass: "#e8f7ee", liq: "#57b97e", deep: "#2e8a55",
    level: .97, amp: .022, spd: .5, breathe: .045, fillFrom: .5,
  },
  blocked: {
    title: "blocked", desc: "marea agitada y pulso profundo — pide atención",
    glass: "#ffe0d8", liq: "#d9503c", deep: "#8e2517",
    level: .66, amp: .09, spd: 1.2, breathe: 0, choppy: true, throb: .05,
  },
  offline: {
    title: "offline", desc: "casi vacía, superficie quieta",
    glass: "#c3cad0", liq: "#5c656d", deep: "#3a4249",
    level: .13, amp: .008, spd: .12, breathe: .012,
  },
};

const grid = document.getElementById("grid");

function duna(cfg) {
  const cell = document.createElement("div");
  cell.className = "cell";
  cell.innerHTML = `<b>${cfg.title}</b><canvas width="400" height="400"></canvas><span>${cfg.desc}</span>`;
  grid.appendChild(cell);
  const g = cell.querySelector("canvas").getContext("2d");
  const S = 400, C = S/2;
  const GLASS = hex(cfg.glass), LIQ = hex(cfg.liq), DEEP = hex(cfg.deep);

  const bubbles = [];
  let level = cfg.fillFrom ?? cfg.level;   // pass arranca a la mitad y se llena
  let t = 0, last = performance.now();

  (function loop(now) {
    const dt = Math.min((now-last)/1000, .05); last = now;
    t += dt;
    try { draw(dt); } catch (e) { console.error(cfg.title, e); }
    requestAnimationFrame(loop);
  })(performance.now());

  function draw(dt) {
    g.clearRect(0,0,S,S);

    // nivel: pass se llena lentamente; working chapotea alrededor del suyo
    let targetLevel = cfg.level;
    if (cfg.slosh) targetLevel += Math.sin(t*.8) * cfg.slosh;
    level = lerp(level, targetLevel, 1 - Math.pow(.25, dt));

    // radio: respiración; blocked late en su lugar
    let R = S*.27;
    R *= 1 + Math.sin(t*.75) * (cfg.breathe || 0);
    if (cfg.throb) {
      const b = (t*1.5) % (Math.PI*2);
      R *= 1 + Math.max(0, Math.sin(b))**4 * cfg.throb;
    }

    // halo exterior suave
    const h = g.createRadialGradient(C,C,R*.7, C,C,R*1.9);
    h.addColorStop(0, css(LIQ,.15)); h.addColorStop(1, css(LIQ,0));
    g.fillStyle = h; g.fillRect(0,0,S,S);

    g.save();
    g.beginPath(); g.arc(C,C,R,0,7); g.clip();

    // cristal: interior claro con leve tinte
    const bg = g.createRadialGradient(C-R*.3, C-R*.4, R*.2, C, C, R*1.4);
    bg.addColorStop(0, css(lerp3(GLASS,[255,255,255],.5),.95));
    bg.addColorStop(1, css(GLASS,.85));
    g.fillStyle = bg; g.fillRect(0,0,S,S);

    // línea de agua: y sube con el nivel
    const waterY = C + R - 2*R*level;

    // dos capas de líquido con oleaje desfasado
    const layers = [
      { off: 0,      spd: cfg.spd,      amp: cfg.amp,      col: LIQ,  al: .92 },
      { off: R*.09,  spd: cfg.spd*.65,  amp: cfg.amp*.6,   col: DEEP, al: .75 },
    ];
    for (const L of layers) {
      g.beginPath();
      g.moveTo(C-R, S);
      for (let x = -R; x <= R; x += 4) {
        let y = waterY + L.off
          + Math.sin(x/R*2.6 + t*L.spd) * R*L.amp
          + Math.sin(x/R*4.7 - t*L.spd*1.6) * R*L.amp*.45;
        if (cfg.choppy) y += Math.sin(x/R*8 + t*L.spd*2.4) * R*L.amp*.35;
        g.lineTo(C+x, y);
      }
      g.lineTo(C+R, S); g.closePath();
      g.fillStyle = css(L.col, L.al);
      g.fill();
    }

    // burbujas (solo working): pocas, suaves, sin grano
    if (cfg.bubbles) {
      if (Math.random() < dt*2.2) {
        bubbles.push({ x: C + (Math.random()-.5)*R*1.2, y: C+R*.9, r: 2.5+Math.random()*3.5, a:.0, vy: 26+Math.random()*18, ph: Math.random()*6 });
      }
      for (const b of bubbles) {
        b.y -= b.vy*dt;
        b.x += Math.sin(t*2+b.ph)*.3;
        b.a = Math.min(b.a + dt*1.5, .35);
        if (b.y < waterY + 6) b.a -= dt*2.5;    // se disuelve al llegar a la superficie
        if (b.a <= 0) continue;
        const bg2 = g.createRadialGradient(b.x,b.y,0,b.x,b.y,b.r*2);
        bg2.addColorStop(0, css(lerp3(GLASS,[255,255,255],.6), b.a));
        bg2.addColorStop(1, css(GLASS,0));
        g.fillStyle = bg2;
        g.beginPath(); g.arc(b.x,b.y,b.r*2,0,7); g.fill();
      }
      while (bubbles.length && bubbles[0].a <= 0) bubbles.shift();
      if (bubbles.length > 12) bubbles.shift();
    }

    // brillo del cristal, arriba a la izquierda
    const hl = g.createRadialGradient(C-R*.38, C-R*.48, 0, C-R*.38, C-R*.48, R*.95);
    hl.addColorStop(0, "rgba(255,255,255,.34)");
    hl.addColorStop(1, "rgba(255,255,255,0)");
    g.fillStyle = hl; g.fillRect(0,0,S,S);
    g.restore();

    // borde del cristal, apenas
    g.beginPath(); g.arc(C,C,R,0,7);
    g.strokeStyle = css(lerp3(GLASS,[255,255,255],.3),.35);
    g.lineWidth = 1.5; g.stroke();
  }
}

for (const key of ["idle","working","pass","blocked","offline"]) duna(STATES[key]);
</script>
</body>
</html>
