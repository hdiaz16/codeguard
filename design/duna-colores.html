<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>DUNA — cinco paletas</title>
<style>
  body {
    margin: 0; min-height: 100vh; background: #101216;
    font-family: "Segoe UI", sans-serif; color: #cfd6dd;
    display: flex; flex-direction: column; align-items: center;
    padding: 28px 12px 48px;
  }
  h1 { font-weight: 300; font-size: 20px; margin: 0 0 4px; }
  p.sub { margin: 0 0 22px; color: #7d8590; font-size: 13px; }
  .row { margin-bottom: 26px; }
  .row h2 {
    font-weight: 600; font-size: 14px; color: #e8edf2; margin: 0 0 2px 6px;
    letter-spacing: .02em;
  }
  .row p { margin: 0 0 8px 6px; font-size: 12px; color: #8a939e; }
  .orbs { display: flex; gap: 12px; flex-wrap: wrap; }
  .cell {
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    background: #171a1f; border-radius: 14px; padding: 8px 10px 6px;
  }
  .cell span { font-size: 10.5px; color: #78818c; }
  canvas { width: 132px; height: 132px; }
</style>
</head>
<body>
  <h1>DUNA — elige la paleta</h1>
  <p class="sub">Cada fila es una propuesta de color; las columnas son idle · working · pass · blocked · offline.</p>
  <div id="root"></div>

<script>
const hex = h => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
const lerp = (x,y,t) => x + (y-x)*t;
const lerp3 = (u,v,t) => [lerp(u[0],v[0],t), lerp(u[1],v[1],t), lerp(u[2],v[2],t)];
const css = (c,a=1) => `rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;

// dinámica por estado (compartida entre paletas)
const DYN = {
  idle:    { level:.48, amp:.045, spd:.55, breathe:.035 },
  working: { level:.55, amp:.11,  spd:1.9, breathe:.02, bubbles:true, slosh:.05 },
  pass:    { level:.97, amp:.022, spd:.5,  breathe:.045, fillFrom:.5 },
  blocked: { level:.66, amp:.09,  spd:1.2, breathe:0, choppy:true, throb:.05 },
  offline: { level:.13, amp:.008, spd:.12, breathe:.012 },
};

// PALETAS: por estado [líquido, capa profunda]; glass = interior del cristal
const PALETTES = [
  {
    name: "1 · OCÉANO", desc: "azules profundos y aguamarina — cristal oscuro",
    glass: "#0e1b26", glassDark: true, edge: "#7fd8e8",
    states: {
      idle:    ["#3ec6dd", "#156a8a"],
      working: ["#4d9dff", "#1a4dbb"],
      pass:    ["#3ce6a6", "#0e8a5c"],
      blocked: ["#ff5e6c", "#a3182e"],
      offline: ["#5a6a75", "#2c363e"],
    },
  },
  {
    name: "2 · NEÓN", desc: "noche cyberpunk: violeta, cian y magenta sobre cristal negro",
    glass: "#12101d", glassDark: true, edge: "#b98aff",
    states: {
      idle:    ["#9d6bff", "#4b2a99"],
      working: ["#00e0ff", "#0077a8"],
      pass:    ["#50ffb0", "#0d9960"],
      blocked: ["#ff3d7e", "#99103f"],
      offline: ["#4e5560", "#262b33"],
    },
  },
  {
    name: "3 · AURORA", desc: "boreal: verdes-turquesa con violetas etéreos",
    glass: "#0f1a1a", glassDark: true, edge: "#8fe8c8",
    states: {
      idle:    ["#4fd8b0", "#1a7a68"],
      working: ["#b8e04d", "#5e8a12"],
      pass:    ["#45e88a", "#128a4d"],
      blocked: ["#e85a8a", "#8a1a45"],
      offline: ["#546068", "#2a3238"],
    },
  },
  {
    name: "4 · PLATA", desc: "monocromo elegante: mercurio líquido, un acento por estado",
    glass: "#15171b", glassDark: true, edge: "#c9d2da",
    states: {
      idle:    ["#c9d2da", "#6b7681"],
      working: ["#ffd66b", "#8a6a1a"],
      pass:    ["#9be8b8", "#4d8a63"],
      blocked: ["#ff7a6b", "#993328"],
      offline: ["#4e565e", "#282d33"],
    },
  },
  {
    name: "5 · JOYA", desc: "tonos gema saturados: zafiro, topacio, esmeralda, rubí",
    glass: "#141117", glassDark: true, edge: "#a8b8ff",
    states: {
      idle:    ["#4d6bff", "#1f2e99"],
      working: ["#ffb830", "#a86a08"],
      pass:    ["#22c98a", "#0a7a50"],
      blocked: ["#e82f4d", "#8a0f26"],
      offline: ["#555d66", "#2b3138"],
    },
  },
];

const root = document.getElementById("root");

function duna(container, dyn, liqHex, deepHex, glassHex, glassDark, edgeHex, label) {
  const cell = document.createElement("div");
  cell.className = "cell";
  cell.innerHTML = `<canvas width="264" height="264"></canvas><span>${label}</span>`;
  container.appendChild(cell);
  const g = cell.querySelector("canvas").getContext("2d");
  const S = 264, C = S/2;
  const GLASS = hex(glassHex), LIQ = hex(liqHex), DEEP = hex(deepHex), EDGE = hex(edgeHex);
  const bubbles = [];
  let level = dyn.fillFrom ?? dyn.level;
  let t = 0, last = performance.now();

  (function loop(now) {
    const dt = Math.min((now-last)/1000, .05); last = now;
    t += dt;
    try { draw(dt); } catch (e) { console.error(label, e); }
    requestAnimationFrame(loop);
  })(performance.now());

  function draw(dt) {
    g.clearRect(0,0,S,S);
    let targetLevel = dyn.level;
    if (dyn.slosh) targetLevel += Math.sin(t*.8) * dyn.slosh;
    level = lerp(level, targetLevel, 1 - Math.pow(.25, dt));

    let R = S*.30;
    R *= 1 + Math.sin(t*.75) * (dyn.breathe || 0);
    if (dyn.throb) R *= 1 + Math.max(0, Math.sin((t*1.5)%(Math.PI*2)))**4 * dyn.throb;

    const h = g.createRadialGradient(C,C,R*.7, C,C,R*1.8);
    h.addColorStop(0, css(LIQ,.18)); h.addColorStop(1, css(LIQ,0));
    g.fillStyle = h; g.fillRect(0,0,S,S);

    g.save();
    g.beginPath(); g.arc(C,C,R,0,7); g.clip();

    // cristal oscuro: profundidad hacia los bordes
    const bg = g.createRadialGradient(C-R*.25, C-R*.35, R*.15, C, C, R*1.35);
    if (glassDark) {
      bg.addColorStop(0, css(lerp3(GLASS,[255,255,255],.14),.98));
      bg.addColorStop(1, css(GLASS,.99));
    } else {
      bg.addColorStop(0, css(lerp3(GLASS,[255,255,255],.5),.95));
      bg.addColorStop(1, css(GLASS,.85));
    }
    g.fillStyle = bg; g.fillRect(0,0,S,S);

    const waterY = C + R - 2*R*level;
    // el líquido se ladea con inercia, como si la esfera se meciera
    const tilt = Math.sin(t * dyn.spd * .45) * dyn.amp * .55
               + Math.sin(t * .23) * .012;
    const surfaceAt = (x, L) => {
      let y = waterY + (L ? L.off : 0) + x * tilt
        + Math.sin(x/R*2.6 + t*(L ? L.spd : dyn.spd)) * R*(L ? L.amp : dyn.amp)
        + Math.sin(x/R*4.7 - t*(L ? L.spd : dyn.spd)*1.6) * R*(L ? L.amp : dyn.amp)*.45;
      if (dyn.choppy) y += Math.sin(x/R*8 + t*(L ? L.spd : dyn.spd)*2.4) * R*(L ? L.amp : dyn.amp)*.35;
      return y;
    };
    for (const L of [
      { off: 0,     spd: dyn.spd,     amp: dyn.amp,     col: LIQ,  al: .9 },
      { off: R*.09, spd: dyn.spd*.65, amp: dyn.amp*.6,  col: DEEP, al: .8 }]) {
      g.beginPath(); g.moveTo(C-R, S);
      for (let x = -R; x <= R; x += 3) g.lineTo(C+x, surfaceAt(x, L));
      g.lineTo(C+R, S); g.closePath();
      g.fillStyle = css(L.col, L.al); g.fill();
    }
    // cresta luminosa: la línea de luz que hace que se lea como líquido
    g.beginPath();
    for (let x = -R; x <= R; x += 3) {
      const y = surfaceAt(x, null);
      x === -R ? g.moveTo(C+x, y) : g.lineTo(C+x, y);
    }
    g.strokeStyle = css(lerp3(LIQ,[255,255,255],.65), .5);
    g.lineWidth = 1.6;
    g.stroke();
    // resplandor del líquido sobre el cristal
    const lg = g.createLinearGradient(0, waterY-R*.25, 0, waterY+R*.4);
    lg.addColorStop(0, css(LIQ,0)); lg.addColorStop(.5, css(LIQ,.22)); lg.addColorStop(1, css(LIQ,0));
    g.fillStyle = lg; g.fillRect(0,0,S,S);

    if (dyn.bubbles) {
      if (Math.random() < dt*2.2) bubbles.push({ x: C+(Math.random()-.5)*R*1.2, y: C+R*.9, r: 2+Math.random()*2.6, a:0, vy: 20+Math.random()*14, ph: Math.random()*6 });
      for (const b of bubbles) {
        b.y -= b.vy*dt; b.x += Math.sin(t*2+b.ph)*.25;
        b.a = Math.min(b.a + dt*1.5, .4);
        if (b.y < waterY + 5) b.a -= dt*2.5;
        if (b.a <= 0) continue;
        const bg2 = g.createRadialGradient(b.x,b.y,0,b.x,b.y,b.r*2);
        bg2.addColorStop(0, css(lerp3(LIQ,[255,255,255],.7), b.a));
        bg2.addColorStop(1, css(LIQ,0));
        g.fillStyle = bg2; g.beginPath(); g.arc(b.x,b.y,b.r*2,0,7); g.fill();
      }
      while (bubbles.length && bubbles[0].a <= 0) bubbles.shift();
      if (bubbles.length > 12) bubbles.shift();
    }

    // brillo del cristal
    const hl = g.createRadialGradient(C-R*.38, C-R*.48, 0, C-R*.38, C-R*.48, R*.9);
    hl.addColorStop(0, glassDark ? "rgba(255,255,255,.16)" : "rgba(255,255,255,.34)");
    hl.addColorStop(1, "rgba(255,255,255,0)");
    g.fillStyle = hl; g.fillRect(0,0,S,S);
    g.restore();

    // filo del cristal con el tono de la paleta
    g.beginPath(); g.arc(C,C,R,0,7);
    g.strokeStyle = css(EDGE,.30);
    g.lineWidth = 1.2; g.stroke();
  }
}

for (const p of PALETTES) {
  const row = document.createElement("div");
  row.className = "row";
  row.innerHTML = `<h2>${p.name}</h2><p>${p.desc}</p><div class="orbs"></div>`;
  root.appendChild(row);
  const orbs = row.querySelector(".orbs");
  for (const s of ["idle","working","pass","blocked","offline"]) {
    duna(orbs, DYN[s], p.states[s][0], p.states[s][1], p.glass, p.glassDark, p.edge, s);
  }
}
</script>
</body>
</html>
