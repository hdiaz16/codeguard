<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>DUNA · MONTAÑA — monocromo</title>
<style>
  body {
    margin: 0; min-height: 100vh; background: #101214;
    font-family: "Segoe UI", sans-serif; color: #c3c9ce;
    display: flex; flex-direction: column; align-items: center;
    padding: 32px 14px 48px;
  }
  h1 { font-weight: 300; font-size: 20px; margin: 0 0 4px; }
  p.sub { margin: 0 0 26px; color: #7d858c; font-size: 13px; }
  .orbs { display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; }
  .cell {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    background: #16191c; border-radius: 18px; padding: 16px 18px 12px;
  }
  .cell b { font-size: 13px; color: #e2e7eb; font-weight: 600; }
  .cell span { font-size: 11px; color: #7d858c; max-width: 190px; text-align: center; }
  canvas { width: 190px; height: 190px; }
</style>
</head>
<body>
  <h1>MONTAÑA — monocromo de pizarra y nieve</h1>
  <p class="sub">La línea del líquido es una cresta de cordillera. Cada estado, un clima.</p>
  <div class="orbs" id="orbs"></div>

<script>
const hex = h => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
const lerp = (x,y,t) => x + (y-x)*t;
const lerp3 = (u,v,t) => [lerp(u[0],v[0],t), lerp(u[1],v[1],t), lerp(u[2],v[2],t)];
const css = (c,a=1) => `rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;

const GLASS = hex("#16181b");

// monocromo de montaña: los estados son CLIMAS, no colores distintos
const STATES = {
  idle: {
    title: "idle", desc: "cordillera serena bajo niebla ligera",
    liq: "#8e979e", deep: "#565f66",
    level:.46, amp:.035, spd:.45, breathe:.028, mist:.30,
  },
  working: {
    title: "working", desc: "ventisca: la cresta se agita, sube nieve",
    liq: "#bcc5cc", deep: "#6d777f",
    level:.52, amp:.085, spd:1.6, breathe:.016, slosh:.04, spindrift:true, mist:.15,
  },
  pass: {
    title: "pass", desc: "amanece: nieve alta y un barrido de sol la recorre",
    liq: "#e9eef2", deep: "#b3bdc5",
    level:.90, amp:.022, spd:.4, breathe:.045, sweep:true,
  },
  blocked: {
    title: "blocked", desc: "granito ferroso, marejada y pulso grave",
    liq: "#a67265", deep: "#63413a",
    level:.62, amp:.075, spd:1.05, breathe:0, choppy:true, throb:.045,
  },
  offline: {
    title: "offline", desc: "montaña dormida: niebla densa que deriva, pulso lentísimo",
    liq: "#565b60", deep: "#35393d",
    level:.20, amp:.006, spd:.10, breathe:.008, mist:.85, sleepPulse:true, dim:.75,
  },
};

const orbs = document.getElementById("orbs");

function duna(cfg) {
  const cell = document.createElement("div");
  cell.className = "cell";
  cell.innerHTML = `<b>${cfg.title}</b><canvas width="380" height="380"></canvas><span>${cfg.desc}</span>`;
  orbs.appendChild(cell);
  const g = cell.querySelector("canvas").getContext("2d");
  const S = 380, C = S/2;
  const LIQ = hex(cfg.liq), DEEP = hex(cfg.deep);
  const flakes = [];
  let level = cfg.sweep ? .5 : cfg.level;   // pass se llena al entrar
  let t = 0, last = performance.now();

  (function loop(now) {
    const dt = Math.min((now-last)/1000, .05); last = now;
    t += dt;
    try { draw(dt); } catch (e) { console.error(cfg.title, e); }
    requestAnimationFrame(loop);
  })(performance.now());

  function draw(dt) {
    g.clearRect(0,0,S,S);
    const dim = cfg.dim ?? 1;

    let targetLevel = cfg.level;
    if (cfg.slosh) targetLevel += Math.sin(t*.8) * cfg.slosh;
    level = lerp(level, targetLevel, 1 - Math.pow(.3, dt));

    let R = S*.29;
    R *= 1 + Math.sin(t*.7) * (cfg.breathe || 0);
    if (cfg.throb) R *= 1 + Math.max(0, Math.sin((t*1.45)%(Math.PI*2)))**4 * cfg.throb;

    // pulso de sueño: cada ~6 s la montaña dormida "existe" un poco más
    let sleepGlow = 0;
    if (cfg.sleepPulse) sleepGlow = Math.max(0, Math.sin(t*.5)) ** 12;

    // halo mínimo
    const h = g.createRadialGradient(C,C,R*.8, C,C,R*1.6);
    h.addColorStop(0, css(LIQ, (.07 + sleepGlow*.10) * dim));
    h.addColorStop(1, css(LIQ,0));
    g.fillStyle = h; g.fillRect(0,0,S,S);

    g.save();
    g.beginPath(); g.arc(C,C,R,0,7); g.clip();

    // cielo de piedra dentro del cristal
    const bg = g.createRadialGradient(C-R*.25, C-R*.35, R*.15, C, C, R*1.35);
    bg.addColorStop(0, css(lerp3(GLASS,[255,255,255],.09*dim),.98));
    bg.addColorStop(1, css(GLASS,.99));
    g.fillStyle = bg; g.fillRect(0,0,S,S);

    const waterY = C + R - 2*R*level;
    const tilt = Math.sin(t * cfg.spd * .45) * cfg.amp * .5 + Math.sin(t*.21) * .008;

    // ── capa profunda: CRESTA DE CORDILLERA (picos suaves) ──
    const ridgeAt = (x) => {
      const k1 = Math.sin(x/R*1.9 + t*cfg.spd*.5 + 1.3);
      const k2 = Math.sin(x/R*4.3 - t*cfg.spd*.3 + .5);
      // |seno| invertido = silueta de picos; mezclado con onda suave
      const ridge = -Math.abs(k1)*.65 - Math.abs(k2)*.35;
      return waterY + R*.10 + x*tilt + ridge * R * (cfg.amp*1.6 + .02);
    };
    g.beginPath(); g.moveTo(C-R, S);
    for (let x=-R; x<=R; x+=3) g.lineTo(C+x, ridgeAt(x));
    g.lineTo(C+R, S); g.closePath();
    g.fillStyle = css(DEEP, .85*dim); g.fill();

    // ── capa frontal: línea de nieve, ola suave ──
    const surfAt = (x) => {
      let y = waterY + x*tilt
        + Math.sin(x/R*2.4 + t*cfg.spd) * R*cfg.amp
        + Math.sin(x/R*4.6 - t*cfg.spd*1.5) * R*cfg.amp*.4;
      if (cfg.choppy) y += Math.sin(x/R*7.5 + t*cfg.spd*2.3) * R*cfg.amp*.35;
      return y;
    };
    g.beginPath(); g.moveTo(C-R, S);
    for (let x=-R; x<=R; x+=3) g.lineTo(C+x, surfAt(x));
    g.lineTo(C+R, S); g.closePath();
    g.fillStyle = css(LIQ, .88*dim); g.fill();

    // cresta con luz fría
    g.beginPath();
    for (let x=-R; x<=R; x+=3) { const y = surfAt(x); x===-R ? g.moveTo(C+x,y) : g.lineTo(C+x,y); }
    g.strokeStyle = css(lerp3(LIQ,[255,255,255],.55), .28*dim);
    g.lineWidth = 1.2; g.stroke();

    // ── pass: barrido de sol de amanecer sobre la nieve ──
    if (cfg.sweep) {
      const sx = C - R*1.6 + (((t*.28) % 2.2) / 2.2) * R*3.2;
      const sg = g.createLinearGradient(sx-R*.6, 0, sx+R*.6, 0);
      sg.addColorStop(0, "rgba(255,255,255,0)");
      sg.addColorStop(.5, "rgba(255,255,255,.16)");
      sg.addColorStop(1, "rgba(255,255,255,0)");
      g.fillStyle = sg;
      g.fillRect(0, waterY - R*.3, S, S);
    }

    // ── working: ventisca — copos que el viento levanta de la cresta ──
    if (cfg.spindrift) {
      if (Math.random() < dt*3) {
        const x0 = (Math.random()-.5)*R*1.4;
        flakes.push({ x: x0, y: surfAt(x0)-2, vx: 14+Math.random()*18, vy: -(8+Math.random()*10), a: 0, r: .8+Math.random()*1.2 });
      }
      for (const f of flakes) {
        f.x += f.vx*dt; f.y += f.vy*dt; f.vy += 6*dt;
        f.a = f.a < .30 ? f.a + dt*1.4 : f.a;
        f.a -= dt*.5;
        if (f.a <= 0) continue;
        g.beginPath(); g.arc(C+f.x, f.y, f.r, 0, 7);
        g.fillStyle = css(lerp3(LIQ,[255,255,255],.6), f.a);
        g.fill();
      }
      while (flakes.length && flakes[0].a <= 0) flakes.shift();
      if (flakes.length > 16) flakes.shift();
    }

    // ── niebla: bandas suaves que derivan (idle sutil, offline densa) ──
    if (cfg.mist) {
      for (const [ph, spdM, yy, hh] of [[0,.06,-.15,.34],[2.5,.04,.12,.28]]) {
        const mx = C + Math.sin(t*spdM + ph) * R * .5;
        const my = waterY + R*yy;
        const mg = g.createRadialGradient(mx, my, 0, mx, my, R*.9);
        mg.addColorStop(0, css(lerp3(LIQ,[255,255,255],.3), .10*cfg.mist));
        mg.addColorStop(1, css(LIQ, 0));
        g.save(); g.scale(1, hh);
        g.beginPath(); g.arc(mx, my/hh, R*.9, 0, 7);
        g.fillStyle = mg; g.fill();
        g.restore();
      }
    }

    // luz de ventana tenue
    const hl = g.createRadialGradient(C-R*.38, C-R*.48, 0, C-R*.38, C-R*.48, R*.9);
    hl.addColorStop(0, `rgba(255,255,255,${.09*dim + sleepGlow*.05})`);
    hl.addColorStop(1, "rgba(255,255,255,0)");
    g.fillStyle = hl; g.fillRect(0,0,S,S);
    g.restore();

    // filo casi invisible
    g.beginPath(); g.arc(C,C,R,0,7);
    g.strokeStyle = css(lerp3(GLASS,[255,255,255],.35), .16*dim + sleepGlow*.12);
    g.lineWidth = 1; g.stroke();
  }
}

for (const key of ["idle","working","pass","blocked","offline"]) duna(STATES[key]);
</script>
</body>
</html>
