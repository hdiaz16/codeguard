<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>CodeGuard</title>
<style>
  /* ── Sistema de diseño MONTAÑA v2 ──────────────────────────────────────
     Profundidad por 3 niveles de color + sombra. CERO bordes: toda la
     separación es luz y elevación. Colores semánticos definidos para
     escanear hallazgos de un vistazo. */
  :root {
    /* profundidad: excavado → base → elevado (+ interactivo) */
    --d0: #121417;   /* excavado: snippets, pozos */
    --d1: #1b1e22;   /* base: la tarjeta del panel */
    --d2: #23272c;   /* elevado: tarjetas de hallazgo */
    --d3: #2c3138;   /* interactivo: botones, hover */

    /* tinta en 3 pesos */
    --ink: #edf0f2; --ink-2: #a9b2ba; --ink-3: #78818a;

    /* semánticos definidos — cada uno significa UNA cosa */
    --accent: #8fb8ce;   /* niebla: marca, enlaces, acciones */
    --block:  #e4604b;   /* bloquea: rojo franco */
    --warn:   #e5b54a;   /* atención: ámbar franco */
    --ok:     #4ec28e;   /* bien: verde franco */

    /* pilares: fondo tintado + texto definido */
    --p-sec-bg: #46231d; --p-sec-fg: #f0937d;
    --p-qua-bg: #1d2b36; --p-qua-fg: #8fc1e3;
    --p-dat-bg: #1d332a; --p-dat-fg: #7fd6a8;

    /* sombras del sistema (la única fuente de separación).
       --float pequeña a propósito: una sombra grande alrededor de la tarjeta
       pinta un halo translúcido sobre el escritorio y se ve como doble fondo. */
    --raise: 0 1px 2px rgba(0,0,0,.45), 0 4px 12px rgba(0,0,0,.22);
    --carve: inset 0 2px 6px rgba(0,0,0,.45);
    --float: 0 3px 10px rgba(0,0,0,.3);
  }
  * { box-sizing: border-box; }
  html, body { background: transparent; }
  body {
    margin: 0; color: var(--ink);
    font-family: "Segoe UI", system-ui, sans-serif; font-size: 13px;
    line-height: 1.45; user-select: none; overflow: hidden;
    height: 100vh; padding: 10px;
  }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ── nivel d1: la tarjeta flotante (sin borde: solo sombra) ── */
  .shell {
    height: 100%; display: flex; flex-direction: column;
    background: var(--d1);
    border-radius: 22px;
    box-shadow: var(--float);
    overflow: hidden;
    transform-origin: 92% 105%;
    opacity: 0;
    /* solo transform+opacity: el compositor los anima sin lag (el blur
       de antes desenfocaba 480x940 px por frame y trababa la entrada) */
    will-change: transform, opacity;
  }
  .shell.enter { animation: bloom .42s cubic-bezier(.22, 1.12, .36, 1) forwards; }
  .shell.leave { animation: fold .22s cubic-bezier(.55, 0, .8, .4) forwards; }
  @keyframes bloom {
    0%   { transform: translate(22px, 50px) scale(.5); opacity: 0; }
    100% { transform: translate(0, 0) scale(1); opacity: 1; }
  }
  @keyframes fold {
    0%   { transform: scale(1); opacity: 1; }
    100% { transform: translate(18px, 40px) scale(.6); opacity: 0; }
  }
  .shell.enter section h2, .shell.enter .degraded, .shell.enter .traynote {
    animation: rise .5s cubic-bezier(.2, .9, .3, 1) both;
  }
  .shell.enter details.card {
    animation: rise .45s cubic-bezier(.2, .9, .3, 1) both;
    animation-delay: calc(var(--i, 0) * 55ms + 70ms);
  }
  .shell.enter .degraded, .shell.enter .traynote { animation-delay: .28s; }
  @keyframes rise {
    from { transform: translateY(14px); opacity: 0; }
    to   { transform: translateY(0);    opacity: 1; }
  }
  main { flex: 1; overflow-y: auto; overflow-x: hidden; padding-bottom: 6px; }
  main::-webkit-scrollbar { width: 8px; }
  main::-webkit-scrollbar-thumb { background: var(--d3); border-radius: 4px; }
  @media (prefers-reduced-motion: reduce) {
    .shell, .shell.enter, .shell.leave, .shell.enter section h2,
    .shell.enter details.card, .shell.enter .degraded, .shell.enter .traynote { animation: none !important; opacity: 1; }
  }

  /* ── cabecera: se separa del contenido con luz, no con línea ── */
  header {
    padding: 16px 18px 12px;
    position: sticky; top: 0; background: var(--d1); z-index: 2;
    box-shadow: 0 10px 14px -12px rgba(0,0,0,.6);
    -webkit-app-region: drag;
  }
  header .brand { font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; }
  .winbtns {
    position: absolute; top: 12px; right: 12px; display: flex; gap: 6px;
    -webkit-app-region: no-drag;
  }
  .winbtns button {
    width: 28px; height: 26px; border: none; border-radius: 8px;
    background: var(--d2); color: var(--ink-3); font-size: 13px;
    cursor: pointer; line-height: 1; box-shadow: var(--raise);
    transition: background .15s, color .15s, transform .1s;
  }
  .winbtns button:hover { background: var(--d3); color: var(--ink); transform: translateY(-1px); }
  .winbtns button.close:hover { background: var(--block); color: #fff; }
  header .verdict { font-size: 15.5px; font-weight: 650; margin-top: 6px; letter-spacing: -.01em; }
  header .meta { color: var(--ink-3); font-size: 11px; margin-top: 3px; }
  .verdict.block   { color: var(--block); }
  .verdict.pass    { color: var(--ok); }
  .verdict.working { color: var(--warn); }

  /* hilo de pensamiento: efímero */
  #thinking {
    color: var(--ink-3); font-size: 11px; font-style: italic; margin-top: 5px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    opacity: 0; transition: opacity .5s;
  }
  #thinking.on { opacity: .85; }
  #thinking .dot {
    display: inline-block; width: 6px; height: 6px; border-radius: 50%;
    background: var(--warn); margin-right: 6px; vertical-align: middle;
    animation: think 1.2s ease-in-out infinite;
  }
  @keyframes think { 50% { opacity: .3; } }

  .parity {
    background: rgba(229,181,74,.12); color: var(--warn);
    padding: 9px 18px; font-size: 12px; font-weight: 500;
  }
  /* cambio de contexto entre proyectos — cada uno con su estado */
  .repos { display: flex; gap: 6px; padding: 8px 18px 2px; flex-wrap: wrap; }
  .repos .tab {
    font-size: 11px; padding: 4px 10px; border-radius: 999px; cursor: pointer;
    background: var(--d2); color: var(--ink-3); transition: .15s; white-space: nowrap;
  }
  .repos .tab:hover { background: var(--d3); color: var(--ink); }
  .repos .tab.activo { background: var(--d3); font-weight: 650; box-shadow: inset 0 0 0 1px rgba(255,255,255,.09); }
  .repos .tab.blk  { color: var(--block); }
  .repos .tab.ok   { color: var(--ok); }
  .repos .tab.none { color: var(--ink-3); }
  .degraded { color: var(--ink-3); font-size: 11px; padding: 8px 18px 14px; }
  .traynote { color: var(--ink-3); font-size: 10.5px; text-align: center; padding: 10px 16px 14px; }
  .empty { color: var(--ink-3); text-align: center; padding: 44px 20px; }
  .truncated { color: var(--ink-3); font-size: 11px; margin: 2px 18px 10px; }

  section h2 {
    font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--ink-3); margin: 16px 18px 8px; font-weight: 650;
  }
  section h2 .bd { color: var(--ink-3); font-weight: 400; text-transform: none; letter-spacing: 0; }

  /* ── nivel d2: tarjetas de hallazgo — elevadas por sombra, cero borde ── */
  .card {
    background: var(--d2);
    border-radius: 12px; margin: 0 12px 10px; overflow: hidden;
    box-shadow: var(--raise);
  }
  .card.blocking { box-shadow: 0 1px 2px rgba(0,0,0,.45), 0 4px 14px rgba(228,96,75,.13); }
  .card summary {
    list-style: none; cursor: pointer; padding: 11px 13px;
    display: flex; gap: 9px; align-items: baseline;
    transition: background .15s;
  }
  .card summary:hover { background: var(--d3); }
  .card summary::-webkit-details-marker { display: none; }
  .rule { font-family: Consolas, monospace; font-size: 11px; color: var(--accent); white-space: nowrap; }
  .card.blocking .rule { color: var(--block); font-weight: 600; }
  .msg { flex: 1; }
  .body { padding: 2px 13px 12px; }

  /* pilar: tinte de fondo + texto definido, sin borde */
  .pillbadge {
    font-size: 9.5px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .07em; padding: 3px 8px; border-radius: 999px;
    white-space: nowrap; align-self: center;
  }
  .pillbadge.p-security { background: var(--p-sec-bg); color: var(--p-sec-fg); }
  .pillbadge.p-quality  { background: var(--p-qua-bg); color: var(--p-qua-fg); }
  .pillbadge.p-data     { background: var(--p-dat-bg); color: var(--p-dat-fg); }

  .chips { display: flex; gap: 6px; margin: 6px 0 4px; flex-wrap: wrap; }
  .chip {
    font-size: 10px; letter-spacing: .06em; text-transform: uppercase;
    padding: 3px 8px; border-radius: 999px;
    color: var(--ink-2); background: var(--d3);
  }
  .chip.sev-error   { background: rgba(228,96,75,.16);  color: var(--block); font-weight: 650; }
  .chip.sev-warning { background: rgba(229,181,74,.15); color: var(--warn); font-weight: 650; }

  .path {
    color: var(--ink-3); font-size: 11px; font-family: Consolas, monospace;
    cursor: pointer; word-break: break-all; user-select: text;
    transition: color .15s;
  }
  .path:hover { color: var(--accent); }
  .path .hint { font-family: "Segoe UI", sans-serif; font-size: 10px; opacity: 0; transition: opacity .15s; }
  .path:hover .hint { opacity: 1; }

  /* ── nivel d0: el código va EXCAVADO (sombra interior, sin borde) ── */
  .snippet {
    background: var(--d0); border-radius: 8px;
    box-shadow: var(--carve);
    font-family: Consolas, monospace; font-size: 11.5px; overflow-x: auto;
    padding: 7px 0; margin: 6px 0 9px; user-select: text;
  }
  .snippet div { padding: 1px 12px; white-space: pre; }
  .snippet .no { color: var(--ink-3); display: inline-block; width: 34px; text-align: right; margin-right: 12px; }
  .snippet .culprit { background: rgba(228,96,75,.16); }
  .card.advisory .snippet .culprit { background: rgba(229,181,74,.14); }

  .why, .fix { color: var(--ink-2); margin: 7px 0; }
  .fix b, .why b { color: var(--ink); font-weight: 600; }

  /* ── nivel d3: lo interactivo — botones que se levantan al tocarlos ── */
  .fb { display: flex; gap: 8px; margin-top: 10px; }
  .fb button {
    background: var(--d3); color: var(--ink-2); border: none;
    border-radius: 8px; padding: 6px 13px; font-size: 11px; cursor: pointer;
    font-family: inherit; box-shadow: var(--raise);
    transition: background .15s, color .15s, transform .1s, box-shadow .15s;
  }
  .fb button:hover { color: var(--ink); transform: translateY(-1px); box-shadow: 0 2px 4px rgba(0,0,0,.5), 0 6px 16px rgba(0,0,0,.3); }
  .fb button.sent { background: rgba(143,184,206,.16); color: var(--accent); pointer-events: none; transform: none; box-shadow: none; }

  .explain {
    margin: 9px 0 2px; padding: 10px 12px; border-radius: 10px;
    background: rgba(143,184,206,.09);
    color: var(--ink-2); font-size: 12.5px; line-height: 1.55;
    animation: rise .4s ease both;
  }
  .explain b { color: var(--accent); font-weight: 650; font-size: 10px;
    text-transform: uppercase; letter-spacing: .1em; display: block; margin-bottom: 4px; }
</style>
</head>
<body>
  <div class="shell" id="card">
  <header>
    <div class="winbtns">
      <button id="btn-graph" title="Generar y abrir el grafo de dependencias del repo">🕸</button>
      <button id="btn-min" title="Contraer al último veredicto">–</button>
      <button id="btn-close" class="close" title="Ocultar panel — CodeGuard sigue en la bandeja">✕</button>
    </div>
    <div class="brand">CodeGuard</div>
    <div class="verdict" id="verdict">esperando el primer análisis…</div>
    <div class="meta" id="meta"></div>
    <div id="thinking"><span class="dot"></span><span id="thinking-text"></span></div>
  </header>
  <div id="parity" class="parity" hidden>Tu rule pack no coincide con el del repo; no puedo garantizar que pase el CI.</div>
  <div id="repos" class="repos" hidden></div>
  <main id="main">
    <div class="empty">Haz un commit en un repo enrolado y aquí aparecerá el resultado.</div>
  </main>
  <div class="traynote">✕ solo oculta el panel — CodeGuard sigue vigilando desde el orbe</div>
  </div>

<script type="module">
  import { Events } from "/wails/runtime.js";

  const $ = (id) => document.getElementById(id);
  const esc = (s) => (s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));

  function emit(name, data) {
    try { Events.Emit(name, data); }
    catch { Events.Emit({ name, data }); } // compat con firmas de betas previas
  }

  function snippetHTML(sn) {
    if (!sn || !sn.length) return "";
    const rows = sn.map(l =>
      `<div class="${l.culprit ? "culprit" : ""}"><span class="no">${l.no}</span>${esc(l.text)}</div>`
    ).join("");
    return `<div class="snippet">${rows}</div>`;
  }

  const PILAR = { quality: "calidad", security: "seguridad", data: "datos" };
  const SEV = { error: "error", warning: "aviso", info: "info" };

  function cardHTML(f, open, repoRoot, i) {
    // Tono §12.2 — determinista = hecho; modelo = observación.
    const kind = f.blocking ? "blocking" : "advisory";
    const full = `${repoRoot}/${f.file}:${f.line}`;
    return `<details class="card ${kind}" style="--i:${i || 0}" ${open ? "open" : ""}>
      <summary>
        <span class="pillbadge p-${esc(f.pillar)}">${esc(PILAR[f.pillar] || f.pillar)}</span>
        <span class="rule">${esc(f.rule_id)}</span>
        <span class="msg">${esc(f.message)}</span>
      </summary>
      <div class="body">
        <div class="chips">
          <span class="chip sev-${esc(f.severity)}">${esc(SEV[f.severity] || f.severity)}</span>
          <span class="chip">motor: ${esc(f.engine)}</span>
          ${f.is_fact ? `<span class="chip">verificado</span>` : `<span class="chip">observación</span>`}
        </div>
        <div class="path" title="clic para copiar la ruta" data-path="${esc(full)}">${esc(full)} <span class="hint">⧉ copiar</span></div>
        ${snippetHTML(f.snippet)}
        ${f.why ? `<div class="why"><b>Por qué importa:</b> ${esc(f.why)}</div>` : ""}
        ${f.fix_hint ? `<div class="fix"><b>Cómo arreglarlo:</b> ${esc(f.fix_hint)}</div>` : ""}
        <div class="fb" data-id="${esc(f.id)}">
          <button data-v="useful">útil</button>
          <button data-v="false_positive">falso positivo</button>
        </div>
      </div>
    </details>`;
  }

  function render(p) {
    const v = $("verdict");
    if (p.verdict === "block") {
      v.textContent = `Bloqueado: ${p.blocking} problema${p.blocking === 1 ? "" : "s"} que el CI también rechazaría`;
      v.className = "verdict block";
    } else {
      v.textContent = p.advisory > 0
        ? `Commit realizado. ${p.advisory} sugerencia${p.advisory === 1 ? "" : "s"} opcional${p.advisory === 1 ? "" : "es"}.`
        : "Commit realizado. Sin observaciones.";
      v.className = "verdict pass";
    }
    const extras = [];
    if (p.ai_generated) extras.push("✦ código generado por IA");
    if (p.suppressed > 0) extras.push(`deuda suprimida: ${p.suppressed}`);
    $("meta").textContent = `${p.repo} @ ${p.branch} · ${p.at} · ${p.elapsed_ms} ms` +
      (extras.length ? ` · ${extras.join(" · ")}` : "");
    $("parity").hidden = p.ci_parity;

    // ── TODOS los proyectos con SU estado, siempre visible ──
    // "marca|nombre|ruta|activo" — verde ✓, bloqueado ⛔, sin análisis ○.
    // Cambiar de pestaña cambia de contexto; ninguno afecta a los demás.
    const tabs = $("repos");
    if (p.otros_repos && p.otros_repos.length > 1) {
      tabs.innerHTML = p.otros_repos.map(s => {
        const [marca, nombre, root, activo] = s.split("|");
        const cls = marca === "⛔" ? "blk" : (marca === "✓" ? "ok" : "none");
        return `<span class="tab ${cls} ${activo === "1" ? "activo" : ""}"
                  data-root="${esc(root)}" title="${esc(root)}">${marca} ${esc(nombre)}</span>`;
      }).join("");
      tabs.hidden = false;
    } else {
      tabs.hidden = true;
    }

    const blockers = (p.findings || []).filter(f => f.blocking);
    const advisory = (p.findings || []).filter(f => !f.blocking);
    const shown = advisory.slice(0, p.max_show);
    const hidden = advisory.length - shown.length;

    let html = "";
    if (blockers.length) {
      // desglose por pilar: "2 de seguridad · 1 de datos"
      const byPillar = {};
      for (const f of blockers) byPillar[f.pillar] = (byPillar[f.pillar] || 0) + 1;
      const detail = Object.entries(byPillar)
        .map(([k, n]) => `${n} de ${PILAR[k] || k}`)
        .join(" · ");
      // acordeón cerrado por defecto: solo el resumen; el dev expande lo que le interesa
      html += `<section><h2>Bloqueantes <span class="bd">— ${detail}</span></h2>` +
        blockers.map((f, i) => cardHTML(f, false, p.repo_root, i)).join("") + `</section>`;
    }
    if (shown.length) {
      html += `<section><h2>Sugerencias</h2>` +
        shown.map((f, i) => cardHTML(f, false, p.repo_root, blockers.length + i)).join("") + `</section>`;
      if (hidden > 0) html += `<div class="truncated">${hidden} sugerencia(s) más, colapsadas por prioridad.</div>`;
    }
    if (p.degraded && p.degraded.length) {
      html += `<div class="degraded">No se revisó: ${p.degraded.map(esc).join(", ")}</div>`;
    }
    if (!html) html = `<div class="empty">Nada que señalar.</div>`;
    $("main").innerHTML = html;

    document.querySelectorAll(".fb button").forEach(btn => {
      btn.addEventListener("click", () => {
        const id = btn.parentElement.dataset.id;
        emit("feedback", [{ finding_id: id, verdict: btn.dataset.v }]);
        btn.classList.add("sent");
        btn.textContent = btn.dataset.v === "useful" ? "útil ✓" : "falso positivo ✓";
      });
    });
    document.querySelectorAll(".path").forEach(el => {
      el.addEventListener("click", () => navigator.clipboard?.writeText(el.dataset.path));
    });
  }

  Events.On("analysis", (e) => {
    const p = Array.isArray(e.data) ? e.data[0] : e.data;
    if (p) render(p);
  });
  // Hilo de pensamiento del modelo (análisis en sombra), en vivo
  const PILAR_THINK = { quality: "calidad", security: "seguridad", data: "datos" };
  Events.On("thinking", (e) => {
    const d = Array.isArray(e.data) ? e.data[0] : e.data;
    const box = $("thinking");
    if (!d || !d.pillar) { box.classList.remove("on"); return; }
    $("thinking-text").textContent =
      `analizando ${PILAR_THINK[d.pillar] || d.pillar} · ${d.text.replace(/\s+/g, " ").trim()}`;
    box.classList.add("on");
  });

  // Explicación del modelo: llega asíncrona y se inserta en su tarjeta
  Events.On("explain", (e) => {
    const d = Array.isArray(e.data) ? e.data[0] : e.data;
    if (!d?.finding_id || !d?.text) return;
    const fb = document.querySelector(`.fb[data-id="${CSS.escape(d.finding_id)}"]`);
    if (!fb || fb.parentElement.querySelector(".explain")) return;
    const div = document.createElement("div");
    div.className = "explain";
    div.innerHTML = `<b>en palabras simples</b>`;
    div.appendChild(document.createTextNode(d.text));
    fb.parentElement.insertBefore(div, fb);
  });

  Events.On("working", (e) => {
    const d = Array.isArray(e.data) ? e.data[0] : e.data;
    const v = $("verdict");
    v.textContent = `Analizando ${d?.repo ?? ""} @ ${d?.branch ?? ""}…`;
    v.className = "verdict working";
  });

  const card = $("card");
  Events.On("panel-show", () => {
    card.classList.remove("leave", "enter");
    void card.offsetWidth; // reiniciar la animación
    card.classList.add("enter");
  });
  // El cierre también es orgánico: se pliega hacia el orbe y LUEGO se oculta.
  function closeOrganic() {
    card.classList.remove("enter");
    card.classList.add("leave");
    setTimeout(() => emit("panel-close", null), 240);
  }
  Events.On("panel-hide", closeOrganic);

  $("btn-close").addEventListener("click", closeOrganic);
  // cambio de contexto entre proyectos
  $("repos").addEventListener("click", e => {
    const t = e.target.closest(".tab[data-root]");
    if (!t || !t.dataset.root) return;
    emit("switch-repo", [t.dataset.root]);
  });

  $("btn-graph").addEventListener("click", () => {
    emit("open-graph", null);
    const b = $("btn-graph");
    b.textContent = "…";
    setTimeout(() => { b.textContent = "🕸"; }, 2500);
  });
  $("btn-min").addEventListener("click", () => {
    const main = $("main");
    main.hidden = !main.hidden; // contrae a solo el veredicto de la cabecera
    $("btn-min").textContent = main.hidden ? "+" : "–";
  });

  emit("panel-ready", null);
</script>
</body>
</html>
