<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>CodeGuard</title>
<style>
  /* ── Sistema de diseño MONTAÑA v2 ──────────────────────────────────────
     Profundidad por 3 niveles de color + sombra. CERO bordes: toda la
     separación es luz y elevación. Colores semánticos definidos para
     escanear hallazgos de un vistazo. */
  :root {
    /* Profundidad construida ALREDEDOR del gris pizarra pedido (#25272c es
       --d1, la tarjeta del panel): un escalón excavado por debajo y dos de
       elevación por encima, manteniendo el mismo salto de luminancia que
       tenía el sistema anterior. */
    --d0: #1a1c20;   /* excavado: snippets, pozos */
    --d1: #25272c;   /* base: la tarjeta del panel */
    --d2: #2e3138;   /* elevado: tarjetas de hallazgo */
    --d3: #383c44;   /* interactivo: botones, hover */

    /* tinta en 3 pesos, con una gota de menta para que no pelee con el acento */
    --ink: #eaf3f0; --ink-2: #a7b3b0; --ink-3: #78847f;

    /* semánticos definidos — cada uno significa UNA cosa.
       La familia menta lleva lo bueno y lo neutro; el rojo y el ámbar quedan
       reservados a la alarma, que es lo único que debe interrumpir. */
    --accent: #b8f7e4;   /* menta: marca, enlaces, acciones */
    --block:  #e4604b;   /* bloquea: rojo franco — se conserva a propósito */
    --warn:   #e5b54a;   /* atención: ámbar franco */
    --ok:     #6fdcb4;   /* bien: menta honda, distinguible del acento claro */

    /* pilares: fondo tintado + texto definido */
    --p-sec-bg: #3d221d; --p-sec-fg: #f0937d;
    --p-qua-bg: #22303a; --p-qua-fg: #9fd0ea;
    --p-dat-bg: #1e3a31; --p-dat-fg: #9beeca;

    /* sombras del sistema (la única fuente de separación).
       --float pequeña a propósito: una sombra grande alrededor de la tarjeta
       pinta un halo translúcido sobre el escritorio y se ve como doble fondo. */
    --raise: 0 1px 2px rgba(0,0,0,.45), 0 4px 12px rgba(0,0,0,.22);
    --carve: inset 0 2px 6px rgba(0,0,0,.45);
    --float: 0 3px 10px rgba(0,0,0,.3);
  }
  * { box-sizing: border-box; }
  html, body { background: transparent; }
  body {
    margin: 0; color: var(--ink);
    font-family: "Segoe UI", system-ui, sans-serif; font-size: 13px;
    line-height: 1.45; user-select: none; overflow: hidden;
    height: 100vh; padding: 10px;
    /* La tarjeta crece hacia arriba desde el orbe, que es de donde sale.
       Antes ocupaba el alto completo de la ventana y un commit con un solo
       hallazgo dejaba dos tercios de panel vacío. */
    display: flex; flex-direction: column; justify-content: flex-end;
  }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ── nivel d1: la tarjeta flotante (sin borde: solo sombra) ── */
  .shell {
    /* Alto según el contenido, con tope: así una lista larga sigue
       desplazándose dentro de la tarjeta en vez de desbordar la ventana. */
    max-height: 100%; display: flex; flex-direction: column;
    background: var(--d1);
    border-radius: 22px;
    box-shadow: var(--float);
    overflow: hidden;
    transform-origin: 92% 105%;
    opacity: 0;
    /* solo transform+opacity: el compositor los anima sin lag (el blur
       de antes desenfocaba 480x940 px por frame y trababa la entrada) */
    will-change: transform, opacity;
  }
  .shell.enter { animation: bloom .42s cubic-bezier(.22, 1.12, .36, 1) forwards; }
  .shell.leave { animation: fold .22s cubic-bezier(.55, 0, .8, .4) forwards; }
  @keyframes bloom {
    0%   { transform: translate(22px, 50px) scale(.5); opacity: 0; }
    100% { transform: translate(0, 0) scale(1); opacity: 1; }
  }
  @keyframes fold {
    0%   { transform: scale(1); opacity: 1; }
    100% { transform: translate(18px, 40px) scale(.6); opacity: 0; }
  }
  .shell.enter section h2, .shell.enter .degraded, .shell.enter .traynote {
    animation: rise .5s cubic-bezier(.2, .9, .3, 1) both;
  }
  .shell.enter details.card {
    animation: rise .45s cubic-bezier(.2, .9, .3, 1) both;
    animation-delay: calc(var(--i, 0) * 55ms + 70ms);
  }
  .shell.enter .degraded, .shell.enter .traynote { animation-delay: .28s; }
  @keyframes rise {
    from { transform: translateY(14px); opacity: 0; }
    to   { transform: translateY(0);    opacity: 1; }
  }
  /* flex:1 estiraba el contenido a todo el alto disponible; con 0 1 auto la
     tarjeta mide lo que mide su contenido y sólo se desplaza si no cabe. */
  main { flex: 0 1 auto; overflow-y: auto; overflow-x: hidden; padding-bottom: 6px; }
  main::-webkit-scrollbar { width: 8px; }
  main::-webkit-scrollbar-thumb { background: var(--d3); border-radius: 4px; }
  @media (prefers-reduced-motion: reduce) {
    .shell, .shell.enter, .shell.leave, .shell.enter section h2,
    .shell.enter details.card, .shell.enter .degraded, .shell.enter .traynote { animation: none !important; opacity: 1; }
  }

  /* ── cabecera: se separa del contenido con luz, no con línea ── */
  header {
    padding: 16px 18px 12px;
    position: sticky; top: 0; background: var(--d1); z-index: 2;
    box-shadow: 0 10px 14px -12px rgba(0,0,0,.6);
    -webkit-app-region: drag;
  }
  header .brand { font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; }
  /* Dos familias, no cinco botones iguales: a la izquierda lo que ABRE cosas
     (guía, mapa, modelo), a la derecha lo que gobierna esta ventana (contraer,
     cerrar). Antes compartían un gap uniforme y el ojo no distinguía "voy a
     otra parte" de "cierro esto". El separador es luz, no una línea. */
  .winbtns {
    position: absolute; top: 12px; right: 12px; display: flex; gap: 4px;
    -webkit-app-region: no-drag;
  }
  .winbtns .grupo { display: flex; gap: 4px; }
  .winbtns .grupo + .grupo { margin-left: 12px; position: relative; }
  .winbtns .grupo + .grupo::before {
    content: ""; position: absolute; left: -6px; top: 6px; bottom: 6px;
    width: 1px; background: rgba(255,255,255,.07);
  }
  .winbtns button {
    width: 28px; height: 28px; border: none; border-radius: 8px;
    background: var(--d2); color: var(--ink-3);
    cursor: pointer; line-height: 0; box-shadow: var(--raise);
    display: grid; place-items: center; padding: 0;
    transition: background .15s, color .15s, transform .1s;
  }
  /* 16 px sobre rejilla de 24 con trazo 2 => 1.33 px efectivos y las líneas
     rectas caen en pixel entero. Antes: rejilla de 20 a 15 px con trazo 1.5,
     o sea 1.125 px — a escalado fraccionario de Windows eso cae ENTRE pixeles
     y por eso los iconos se veian sucios y desiguales. */
  .winbtns button svg {
    width: 16px; height: 16px;
    fill: none; stroke: currentColor; stroke-width: 2;
    stroke-linecap: round; stroke-linejoin: round;
  }
  .winbtns button svg .lleno { fill: currentColor; stroke: none; }
  .winbtns button:hover { background: var(--d3); color: var(--ink); transform: translateY(-1px); }
  .winbtns button:focus-visible { outline: 2px solid var(--ok); outline-offset: 2px; }
  .winbtns button.close:hover { background: var(--block); color: #fff; }
  header .verdict { font-size: 15.5px; font-weight: 650; margin-top: 6px; letter-spacing: -.01em; }
  header .meta { color: var(--ink-3); font-size: 11px; margin-top: 3px; }
  .verdict.block   { color: var(--block); }
  .verdict.pass    { color: var(--ok); }
  .verdict.working { color: var(--warn); }

  /* hilo de pensamiento: efímero */
  #thinking {
    color: var(--ink-3); font-size: 11px; font-style: italic; margin-top: 5px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    opacity: 0; transition: opacity .5s;
  }
  #thinking.on { opacity: .85; }
  #thinking .dot {
    display: inline-block; width: 6px; height: 6px; border-radius: 50%;
    background: var(--warn); margin-right: 6px; vertical-align: middle;
    animation: think 1.2s ease-in-out infinite;
  }
  @keyframes think { 50% { opacity: .3; } }

  .parity {
    background: rgba(229,181,74,.12); color: var(--warn);
    padding: 9px 18px; font-size: 12px; font-weight: 500;
  }
  /* Proyectos vigilados. Antes era una fila de nombres sueltos: quien llegaba
     nuevo veía "repo" y no tenía forma de saber qué era esa lista. Ahora lleva
     título, el estado va en un punto de color (no un emoji, que cambia de
     forma según la fuente) y el proyecto activo dice su estado con palabras. */
  .repos { padding: 10px 18px 4px; }
  .repos .titulo {
    color: var(--ink-3); font-size: 10px; font-weight: 600;
    letter-spacing: .07em; text-transform: uppercase; margin-bottom: 7px;
  }
  .repos .titulo b { color: var(--ink-2); font-weight: 600; }
  .repos .fila { display: flex; gap: 6px; flex-wrap: wrap; }
  .repos .tab {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 11.5px; padding: 5px 11px; border-radius: 999px; cursor: pointer;
    background: var(--d2); color: var(--ink-2); transition: .15s; white-space: nowrap;
  }
  .repos .tab:hover { background: var(--d3); color: var(--ink); }
  .repos .tab .punto {
    width: 7px; height: 7px; border-radius: 50%; flex: none;
    background: var(--ink-3);
  }
  .repos .tab.blk  .punto { background: var(--block); }
  .repos .tab.ok   .punto { background: var(--ok); }
  .repos .tab.none .punto { background: transparent; box-shadow: inset 0 0 0 1.5px var(--ink-3); }
  .repos .tab.activo {
    background: var(--d3); color: var(--ink); font-weight: 600;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.09);
  }
  .repos .tab .estado { color: var(--ink-3); font-weight: 400; }
  .repos .tab.activo.blk .estado { color: var(--block); }
  .repos .tab.activo.ok  .estado { color: var(--ok); }
  .degraded { color: var(--ink-3); font-size: 11px; padding: 8px 18px 14px; }
  .traynote { color: var(--ink-3); font-size: 10.5px; text-align: center; padding: 10px 16px 14px; }
  .empty { color: var(--ink-3); text-align: center; padding: 44px 20px; }
  .truncated { color: var(--ink-3); font-size: 11px; margin: 2px 18px 10px; }

  section h2 {
    font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--ink-3); margin: 16px 18px 8px; font-weight: 650;
  }
  section h2 .bd { color: var(--ink-3); font-weight: 400; text-transform: none; letter-spacing: 0; }

  /* ── nivel d2: tarjetas de hallazgo — elevadas por sombra, cero borde ── */
  .card {
    background: var(--d2);
    border-radius: 12px; margin: 0 12px 10px; overflow: hidden;
    box-shadow: var(--raise);
  }
  .card.blocking { box-shadow: 0 1px 2px rgba(0,0,0,.45), 0 4px 14px rgba(228,96,75,.13); }
  .card summary {
    list-style: none; cursor: pointer; padding: 11px 13px;
    display: flex; gap: 9px; align-items: baseline;
    transition: background .15s;
  }
  .card summary:hover { background: var(--d3); }
  .card summary::-webkit-details-marker { display: none; }
  .rule { font-family: Consolas, monospace; font-size: 11px; color: var(--accent); white-space: nowrap; }
  .card.blocking .rule { color: var(--block); font-weight: 600; }
  .msg { flex: 1; }
  .body { padding: 2px 13px 12px; }

  /* pilar: tinte de fondo + texto definido, sin borde */
  .pillbadge {
    font-size: 9.5px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .07em; padding: 3px 8px; border-radius: 999px;
    white-space: nowrap; align-self: center;
  }
  .pillbadge.p-security { background: var(--p-sec-bg); color: var(--p-sec-fg); }
  .pillbadge.p-quality  { background: var(--p-qua-bg); color: var(--p-qua-fg); }
  .pillbadge.p-data     { background: var(--p-dat-bg); color: var(--p-dat-fg); }

  .chips { display: flex; gap: 6px; margin: 6px 0 4px; flex-wrap: wrap; }
  .chip {
    font-size: 10px; letter-spacing: .06em; text-transform: uppercase;
    padding: 3px 8px; border-radius: 999px;
    color: var(--ink-2); background: var(--d3);
  }
  .chip.sev-error   { background: rgba(228,96,75,.16);  color: var(--block); font-weight: 650; }
  .chip.sev-warning { background: rgba(229,181,74,.15); color: var(--warn); font-weight: 650; }

  .path {
    color: var(--ink-3); font-size: 11px; font-family: Consolas, monospace;
    cursor: pointer; word-break: break-all; user-select: text;
    transition: color .15s;
  }
  .path:hover { color: var(--accent); }
  .path .hint { font-family: "Segoe UI", sans-serif; font-size: 10px; opacity: 0; transition: opacity .15s; }
  .path:hover .hint { opacity: 1; }

  /* ── nivel d0: el código va EXCAVADO (sombra interior, sin borde) ── */
  .snippet {
    background: var(--d0); border-radius: 8px;
    box-shadow: var(--carve);
    font-family: Consolas, monospace; font-size: 11.5px; overflow-x: auto;
    padding: 7px 0; margin: 6px 0 9px; user-select: text;
  }
  .snippet div { padding: 1px 12px; white-space: pre; }
  .snippet .no { color: var(--ink-3); display: inline-block; width: 34px; text-align: right; margin-right: 12px; }
  .snippet .culprit { background: rgba(228,96,75,.16); }
  .card.advisory .snippet .culprit { background: rgba(229,181,74,.14); }

  .why, .fix { color: var(--ink-2); margin: 7px 0; }
  .fix b, .why b { color: var(--ink); font-weight: 600; }

  /* ── nivel d3: lo interactivo — botones que se levantan al tocarlos ── */
  .fb { display: flex; gap: 8px; margin-top: 10px; }
  .fb button {
    background: var(--d3); color: var(--ink-2); border: none;
    border-radius: 8px; padding: 6px 13px; font-size: 11px; cursor: pointer;
    font-family: inherit; box-shadow: var(--raise);
    transition: background .15s, color .15s, transform .1s, box-shadow .15s;
  }
  .fb button:hover { color: var(--ink); transform: translateY(-1px); box-shadow: 0 2px 4px rgba(0,0,0,.5), 0 6px 16px rgba(0,0,0,.3); }
  .fb button.sent { background: rgba(184,247,228,.14); color: var(--accent); pointer-events: none; transform: none; box-shadow: none; }

  .explain {
    margin: 9px 0 2px; padding: 10px 12px; border-radius: 10px;
    background: rgba(184,247,228,.08);
    color: var(--ink-2); font-size: 12.5px; line-height: 1.55;
    animation: rise .4s ease both;
  }
  .explain b { color: var(--accent); font-weight: 650; font-size: 10px;
    text-transform: uppercase; letter-spacing: .1em; display: block; margin-bottom: 4px; }
</style>
</head>
<body>
  <div class="shell" id="card">
  <header>
    <!-- Íconos dibujados, no emojis: un emoji cambia de forma según la fuente
         del sistema y ninguno decía con claridad qué hacía el botón. -->
    <div class="winbtns">
      <div class="grupo">
        <button id="btn-help" aria-label="Guía de uso"
                title="Guía de uso — qué es cada cosa, paso a paso">
          <!-- Interrogación dentro del círculo, con el gancho y el punto sobre
               la misma vertical (x=12). El anterior tenía el gancho descentrado
               y a 15 px parecía un borrón. -->
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="9"/>
            <path d="M9.4 9.3a2.7 2.7 0 1 1 3.4 2.6c-.5.2-.8.7-.8 1.2v.6"/>
            <circle cx="12" cy="17" r="1.1" class="lleno"/>
          </svg>
        </button>
        <button id="btn-graph" aria-label="Mapa del código"
                title="Mapa del código — quién llama a quién, en 3D">
          <!-- Tres nodos y un centro: las aristas salen del BORDE de cada
               círculo, no de su centro, así no se ven pinchados. -->
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 6.5v3M9.6 14.4l-2 2M14.4 14.4l2 2"/>
            <circle cx="12" cy="12" r="2.5"/>
            <circle cx="12" cy="4.5" r="2" class="lleno"/>
            <circle cx="6" cy="18" r="2" class="lleno"/>
            <circle cx="18" cy="18" r="2" class="lleno"/>
          </svg>
        </button>
        <button id="btn-config" aria-label="Configurar el modelo"
                title="Configurar el modelo que aconseja — proveedor, endpoint y clave">
          <!-- Deslizadores, no engranaje: los 8 dientes del engranaje a 16 px
               eran ocho segmentos de 2 px peleándose por el mismo pixel. Dos
               carriles con su tirador se leen a cualquier tamaño, y describen
               mejor lo que hay detrás (ajustes), no "maquinaria". -->
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 9h16M4 15h16"/>
            <circle cx="9.5" cy="9" r="2.4" class="lleno"/>
            <circle cx="15" cy="15" r="2.4" class="lleno"/>
          </svg>
        </button>
      </div>
      <div class="grupo">
        <button id="btn-min" aria-label="Contraer"
                title="Contraer — deja sólo el veredicto">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12"/></svg>
        </button>
        <button id="btn-close" class="close" aria-label="Ocultar panel"
                title="Ocultar el panel — CodeGuard sigue vigilando desde el orbe">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17"/></svg>
        </button>
      </div>
    </div>
    <div class="brand">CodeGuard</div>
    <div class="verdict" id="verdict">esperando el primer análisis…</div>
    <div class="meta" id="meta"></div>
    <div id="thinking"><span class="dot"></span><span id="thinking-text"></span></div>
  </header>
  <div id="parity" class="parity" hidden>Tu rule pack no coincide con el del repo; no puedo garantizar que pase el CI.</div>
  <div id="repos" class="repos" hidden></div>
  <main id="main">
    <div class="empty">Haz un commit en un repo enrolado y aquí aparecerá el resultado.</div>
  </main>
  <div class="traynote">✕ solo oculta el panel — CodeGuard sigue vigilando desde el orbe</div>
  </div>

<script type="module">
  import { Events } from "/wails/runtime.js";

  const $ = (id) => document.getElementById(id);
  const esc = (s) => (s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));

  function emit(name, data) {
    try { Events.Emit(name, data); }
    catch { Events.Emit({ name, data }); } // compat con firmas de betas previas
  }

  function snippetHTML(sn) {
    if (!sn || !sn.length) return "";
    const rows = sn.map(l =>
      `<div class="${l.culprit ? "culprit" : ""}"><span class="no">${l.no}</span>${esc(l.text)}</div>`
    ).join("");
    return `<div class="snippet">${rows}</div>`;
  }

  const PILAR = { quality: "calidad", security: "seguridad", data: "datos" };
  const SEV = { error: "error", warning: "aviso", info: "info" };

  function cardHTML(f, open, repoRoot, i) {
    // Tono §12.2 — determinista = hecho; modelo = observación.
    const kind = f.blocking ? "blocking" : "advisory";
    const full = `${repoRoot}/${f.file}:${f.line}`;
    return `<details class="card ${kind}" style="--i:${i || 0}" ${open ? "open" : ""}>
      <summary>
        <span class="pillbadge p-${esc(f.pillar)}">${esc(PILAR[f.pillar] || f.pillar)}</span>
        <span class="rule">${esc(f.rule_id)}</span>
        <span class="msg">${esc(f.message)}</span>
      </summary>
      <div class="body">
        <div class="chips">
          <span class="chip sev-${esc(f.severity)}">${esc(SEV[f.severity] || f.severity)}</span>
          <span class="chip">motor: ${esc(f.engine)}</span>
          ${f.is_fact ? `<span class="chip">verificado</span>` : `<span class="chip">observación</span>`}
        </div>
        <div class="path" title="clic para copiar la ruta" data-path="${esc(full)}">${esc(full)} <span class="hint">⧉ copiar</span></div>
        ${snippetHTML(f.snippet)}
        ${f.why ? `<div class="why"><b>Por qué importa:</b> ${esc(f.why)}</div>` : ""}
        ${f.fix_hint ? `<div class="fix"><b>Cómo arreglarlo:</b> ${esc(f.fix_hint)}</div>` : ""}
        <div class="fb" data-id="${esc(f.id)}">
          <button data-v="useful">útil</button>
          <button data-v="false_positive">falso positivo</button>
        </div>
      </div>
    </details>`;
  }

  // Raíz del proyecto que se está viendo AHORA. El botón del grafo debe abrir
  // el de este proyecto, no el del último que se analizó: con varios repos
  // enrolados no son el mismo, y el dev que selecciona uno bloqueado espera
  // ver ese.
  let rootActual = null;

  function render(p) {
    rootActual = p.repo_root || null;
    const v = $("verdict");
    if (p.verdict === "block") {
      v.textContent = `Bloqueado: ${p.blocking} problema${p.blocking === 1 ? "" : "s"} que el CI también rechazaría`;
      v.className = "verdict block";
    } else {
      v.textContent = p.advisory > 0
        ? `Commit realizado. ${p.advisory} sugerencia${p.advisory === 1 ? "" : "s"} opcional${p.advisory === 1 ? "" : "es"}.`
        : "Commit realizado. Sin observaciones.";
      v.className = "verdict pass";
    }
    const extras = [];
    if (p.ai_generated) extras.push("✦ código generado por IA");
    if (p.suppressed > 0) extras.push(`deuda suprimida: ${p.suppressed}`);
    $("meta").textContent = `${p.repo} @ ${p.branch} · ${p.at} · ${p.elapsed_ms} ms` +
      (extras.length ? ` · ${extras.join(" · ")}` : "");
    $("parity").hidden = p.ci_parity;

    // ── TODOS los proyectos con SU estado, siempre visible ──
    // "marca|nombre|ruta|activo" — verde ✓, bloqueado ⛔, sin análisis ○.
    // Cambiar de pestaña cambia de contexto; ninguno afecta a los demás.
    const tabs = $("repos");
    if (p.otros_repos && p.otros_repos.length > 1) {
      // Cada estado se nombra con palabras, no sólo con un color: quien llega
      // nuevo no tiene por qué deducir qué significa un punto.
      const ESTADO = {
        "⛔": { clase: "blk",  corto: "bloqueado",
                largo: "bloqueado — el último commit tiene problemas por resolver" },
        "✓":  { clase: "ok",   corto: "limpio",
                largo: "limpio — el último commit pasó todas las compuertas" },
        "○":  { clase: "none", corto: "sin analizar",
                largo: "enrolado pero sin analizar todavía — haz un commit aquí y verás su estado" },
      };
      const chips = p.otros_repos.map(s => {
        const [marca, nombre, root, activo] = s.split("|");
        const e = ESTADO[marca] || ESTADO["○"];
        const esActivo = activo === "1";
        // El estado en texto sólo en el activo: en los demás sería ruido.
        const etiqueta = esActivo ? `<span class="estado">· ${e.corto}</span>` : "";
        return `<span class="tab ${e.clase} ${esActivo ? "activo" : ""}"
                  data-root="${esc(root)}" role="button" tabindex="0"
                  title="${esc(nombre)} — ${esc(e.largo)}&#10;${esc(root)}&#10;(clic para ver este proyecto)"
                  ><span class="punto"></span>${esc(nombre)}${etiqueta}</span>`;
      }).join("");
      const n = p.otros_repos.length;
      tabs.innerHTML =
        `<div class="titulo">Proyectos que vigilo · <b>${n}</b> — clic para cambiar</div>` +
        `<div class="fila">${chips}</div>`;
      tabs.hidden = false;
    } else {
      tabs.hidden = true;
    }

    const blockers = (p.findings || []).filter(f => f.blocking);
    const advisory = (p.findings || []).filter(f => !f.blocking);
    const shown = advisory.slice(0, p.max_show);
    const hidden = advisory.length - shown.length;

    let html = "";
    if (blockers.length) {
      // desglose por pilar: "2 de seguridad · 1 de datos"
      const byPillar = {};
      for (const f of blockers) byPillar[f.pillar] = (byPillar[f.pillar] || 0) + 1;
      const detail = Object.entries(byPillar)
        .map(([k, n]) => `${n} de ${PILAR[k] || k}`)
        .join(" · ");
      // acordeón cerrado por defecto: solo el resumen; el dev expande lo que le interesa
      html += `<section><h2>Bloqueantes <span class="bd">— ${detail}</span></h2>` +
        blockers.map((f, i) => cardHTML(f, false, p.repo_root, i)).join("") + `</section>`;
    }
    if (shown.length) {
      html += `<section><h2>Sugerencias</h2>` +
        shown.map((f, i) => cardHTML(f, false, p.repo_root, blockers.length + i)).join("") + `</section>`;
      if (hidden > 0) html += `<div class="truncated">${hidden} sugerencia(s) más, colapsadas por prioridad.</div>`;
    }
    if (p.degraded && p.degraded.length) {
      html += `<div class="degraded">No se revisó: ${p.degraded.map(esc).join(", ")}</div>`;
    }
    // Estados vacíos EXPLÍCITOS: nunca dejar al dev adivinando qué pasó.
    if (!html) {
      if (p.verdict === "—") {
        html = `<div class="empty"><b>Este proyecto está enrolado pero aún no se ha analizado.</b><br><br>
          CodeGuard ya vigila sus commits: haz uno y aquí verás el resultado.<br>
          Mientras tanto puedes abrir su explorador de código con 🕸.</div>`;
      } else if (p.verdict === "skipped") {
        html = `<div class="empty"><b>Análisis omitido.</b><br><br>
          Fue un merge, un revert, o todos los archivos del cambio están excluidos en la config.</div>`;
      } else {
        html = `<div class="empty"><b>Sin observaciones.</b><br><br>
          El cambio pasó las compuertas de secretos, formato, tipos, reglas y migraciones.</div>`;
      }
    }
    $("main").innerHTML = html;

    document.querySelectorAll(".fb button").forEach(btn => {
      btn.addEventListener("click", () => {
        const id = btn.parentElement.dataset.id;
        emit("feedback", [{ finding_id: id, verdict: btn.dataset.v }]);
        btn.classList.add("sent");
        btn.textContent = btn.dataset.v === "useful" ? "útil ✓" : "falso positivo ✓";
      });
    });
    document.querySelectorAll(".path").forEach(el => {
      el.addEventListener("click", () => navigator.clipboard?.writeText(el.dataset.path));
    });
  }

  Events.On("analysis", (e) => {
    const p = Array.isArray(e.data) ? e.data[0] : e.data;
    if (p) render(p);
  });
  // Hilo de pensamiento del modelo (análisis en sombra), en vivo
  const PILAR_THINK = { quality: "calidad", security: "seguridad", data: "datos" };
  Events.On("thinking", (e) => {
    const d = Array.isArray(e.data) ? e.data[0] : e.data;
    const box = $("thinking");
    if (!d || !d.pillar) { box.classList.remove("on"); return; }
    $("thinking-text").textContent =
      `analizando ${PILAR_THINK[d.pillar] || d.pillar} · ${d.text.replace(/\s+/g, " ").trim()}`;
    box.classList.add("on");
  });

  // Explicación del modelo: llega asíncrona y se inserta en su tarjeta
  Events.On("explain", (e) => {
    const d = Array.isArray(e.data) ? e.data[0] : e.data;
    if (!d?.finding_id || !d?.text) return;
    const fb = document.querySelector(`.fb[data-id="${CSS.escape(d.finding_id)}"]`);
    if (!fb || fb.parentElement.querySelector(".explain")) return;
    const div = document.createElement("div");
    div.className = "explain";
    div.innerHTML = `<b>en palabras simples</b>`;
    div.appendChild(document.createTextNode(d.text));
    fb.parentElement.insertBefore(div, fb);
  });

  Events.On("working", (e) => {
    const d = Array.isArray(e.data) ? e.data[0] : e.data;
    const v = $("verdict");
    v.textContent = `Analizando ${d?.repo ?? ""} @ ${d?.branch ?? ""}…`;
    v.className = "verdict working";
  });

  const card = $("card");
  Events.On("panel-show", () => {
    card.classList.remove("leave", "enter");
    void card.offsetWidth; // reiniciar la animación
    card.classList.add("enter");
  });
  // El cierre también es orgánico: se pliega hacia el orbe y LUEGO se oculta.
  function closeOrganic() {
    card.classList.remove("enter");
    card.classList.add("leave");
    setTimeout(() => emit("panel-close", null), 240);
  }
  Events.On("panel-hide", closeOrganic);

  $("btn-close").addEventListener("click", closeOrganic);
  // cambio de contexto entre proyectos
  function cambiarProyecto(destino) {
    const t = destino.closest(".tab[data-root]");
    if (!t || !t.dataset.root) return;
    emit("switch-repo", [t.dataset.root]);
  }
  $("repos").addEventListener("click", e => cambiarProyecto(e.target));
  // Son botones de verdad (role="button"), así que también con teclado.
  $("repos").addEventListener("keydown", e => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); cambiarProyecto(e.target); }
  });

  $("btn-help").addEventListener("click", () => emit("open-guide", null));
  $("btn-config").addEventListener("click", () => emit("open-config", null));

  $("btn-graph").addEventListener("click", () => {
    emit("open-graph", rootActual ? [rootActual] : null);
    const b = $("btn-graph");
    b.textContent = "…";
    setTimeout(() => { b.textContent = "🕸"; }, 2500);
  });
  $("btn-min").addEventListener("click", () => {
    const main = $("main");
    main.hidden = !main.hidden; // contrae a solo el veredicto de la cabecera
    $("btn-min").textContent = main.hidden ? "+" : "–";
  });

  // ── La ventana se recorta a la tarjeta ──────────────────────────────────
  //
  // El panel mide 480 x ~900 px, pero su contenido crece hacia ARRIBA desde el
  // orbe (justify-content: flex-end), así que con pocos hallazgos la mitad
  // superior de la ventana está vacía. Vacía y transparente — pero sigue
  // siendo ventana, sigue estando encima, y se traga los clics de esa franja
  // de pantalla. El usuario ve una zona muerta y nada que la explique.
  //
  // La tarjeta dice dónde acaba de verdad y el daemon recorta la ventana a esa
  // forma (SetWindowRgn); lo de fuera deja de existir para el ratón. Va
  // devicePixelRatio con la medida porque es el factor con el que se midió: en
  // un monitor al 150% el recorte caería donde no es.
  const tarjeta = $("card");
  let ultimaForma = "";
  function publicarZonaActiva() {
    // Caja de MAQUETACIÓN, no de pintado: la tarjeta entra con una animación
    // que arranca en scale(.5) y sale plegándose. getBoundingClientRect
    // incluye esas transformaciones, así que medir a media animación daría una
    // región más pequeña que la tarjeta que se está dibujando y la recortaría
    // justo mientras se mueve. offsetWidth/offsetHeight ignoran los transform
    // y devuelven siempre la forma en reposo, que es la que debe tener la
    // ventana.
    if (tarjeta.offsetWidth <= 0 || tarjeta.offsetHeight <= 0) return;
    let x = 0, y = 0;
    for (let n = tarjeta; n; n = n.offsetParent) {
      x += n.offsetLeft;
      y += n.offsetTop;
    }
    // 3 px de margen: la tarjeta tiene sombra, y recortar al borde exacto la
    // corta en seco y se ve un canto duro.
    const zonas = [{
      x: x - 3, y: y - 3, w: tarjeta.offsetWidth + 6, h: tarjeta.offsetHeight + 6, radio: 14,
    }];
    const forma = JSON.stringify(zonas);
    if (forma === ultimaForma) return;
    ultimaForma = forma;
    emit("zona-activa", {
      ventana: "CodeGuard",
      escala: window.devicePixelRatio || 1,
      zonas: zonas,
    });
  }

  // El contenido cambia de alto cada vez que llega un análisis, se pliega una
  // tarjeta o se abre la lista de proyectos.
  publicarZonaActiva();
  new ResizeObserver(publicarZonaActiva).observe(tarjeta);
  new MutationObserver(publicarZonaActiva).observe(tarjeta, {
    childList: true, subtree: true, attributes: true,
  });
  setInterval(publicarZonaActiva, 500); // red de seguridad para las transiciones

  emit("panel-ready", null);
</script>
</body>
</html>
