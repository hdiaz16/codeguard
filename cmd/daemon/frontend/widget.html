<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>CodeGuard estado</title>
<style>
  html, body {
    margin: 0; width: 100%; height: 100%; overflow: hidden;
    background: transparent; user-select: none;
  }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
  import { Events } from "/wails/runtime.js";

  // ── Esfera "Her": una sola forma fluida, minimalista y cálida.
  //    Sin partículas, sin anillos, sin ruido — solo luz y respiración. ──

  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");
  const DPR = window.devicePixelRatio || 1;
  let W, H, OX, OY;
  function resize() {
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    canvas.style.width = W + "px"; canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    OX = W - 64; OY = H - 66;
  }
  resize();
  window.addEventListener("resize", resize);

  const STATES = {
    idle:     { a:"#ffe3d3", b:"#e2896b", amp:.030, spd:.30, br:.045, beat:0, whisper:"en reposo" },
    working:  { a:"#ffe9c2", b:"#e8a13d", amp:.060, spd:.95, br:.030, beat:0, whisper:"analizando…" },
    pass:     { a:"#ddf5e5", b:"#57b97e", amp:.032, spd:.40, br:.055, beat:0, whisper:"todo bien" },
    blocked:  { a:"#ffd4c9", b:"#d9503c", amp:.045, spd:.75, br:0,    beat:1, whisper:"commit bloqueado" },
    degraded: { a:"#ffe0bd", b:"#dd8850", amp:.040, spd:.50, br:.040, beat:0, whisper:"revisión parcial" },
    offline:  { a:"#aeb6bd", b:"#5c656d", amp:.012, spd:.12, br:.020, beat:0, whisper:"sin conexión" },
  };

  const hex = h => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
  const lerp = (x,y,t) => x + (y-x)*t;
  const lerp3 = (u,v,t) => [lerp(u[0],v[0],t), lerp(u[1],v[1],t), lerp(u[2],v[2],t)];
  const css = (c,a=1) => `rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;

  let target = STATES.idle;
  let cur = { amp: target.amp, spd: target.spd, br: target.br, beat: 0 };
  let curA = hex(target.a), curB = hex(target.b);
  const ph = [Math.random()*6.28, Math.random()*6.28, Math.random()*6.28, Math.random()*6.28];

  let whisper = { text: "", t0: -9 };
  let gesture = { t0: -9, dir: 1 };
  let mouse = null, lean = { x: 0, y: 0 }, swell = 1;
  canvas.addEventListener("mousemove", e => { mouse = { x: e.offsetX, y: e.offsetY }; });
  canvas.addEventListener("mouseleave", () => { mouse = null; });

  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let t = 0, tNow = 0, last = performance.now();

  function frame(now) {
    const dt = Math.min((now - last) / 1000, .05);
    last = now;
    tNow = now / 1000;
    t += dt * cur.spd;

    const k = 1 - Math.pow(.002, dt); // fundidos lentos y serenos
    cur.amp = lerp(cur.amp, target.amp, k);
    cur.spd = lerp(cur.spd, target.spd, k);
    cur.br  = lerp(cur.br,  target.br,  k);
    cur.beat = lerp(cur.beat, target.beat, k);
    curA = lerp3(curA, hex(target.a), k);
    curB = lerp3(curB, hex(target.b), k);

    ctx.clearRect(0, 0, W, H);
    let R = 26;

    // respiración
    R *= 1 + Math.sin(t * .8 + ph[0]) * cur.br;
    // latido sereno cuando está bloqueado (un solo pulso profundo)
    if (cur.beat > .01) {
      const b = t * 1.6 % (Math.PI * 2);
      R *= 1 + Math.max(0, Math.sin(b)) ** 4 * .07 * cur.beat;
    }
    // gesto del panel: se expande al soltarlo, se recoge al recibirlo
    const g = tNow - gesture.t0;
    if (g < .7) R *= 1 + gesture.dir * Math.sin(g / .7 * Math.PI) * .09;

    // se inclina apenas hacia el cursor
    let tl = { x: 0, y: 0 }, ts = 1;
    if (mouse) {
      const dx = mouse.x - OX, dy = mouse.y - OY, d = Math.hypot(dx, dy);
      if (d < 90) { tl = { x: dx/d*4, y: dy/d*4 }; ts = 1.05; }
    }
    lean.x = lerp(lean.x, tl.x, k*1.5);
    lean.y = lerp(lean.y, tl.y, k*1.5);
    swell = lerp(swell, ts, k*1.5);
    R *= swell;

    const ox = OX + lean.x + Math.sin(t * .37 + ph[1]) * R * .05;
    const oy = OY + lean.y + Math.cos(t * .29 + ph[2]) * R * .05;

    // contorno: DOS ondulaciones lentas, unidas con curvas — seda, no polígono
    const N = 14;
    const pts = [];
    for (let i = 0; i < N; i++) {
      const th = (i / N) * Math.PI * 2;
      const w = Math.sin(th * 2 + t * .7 + ph[3]) * .7 +
                Math.sin(th * 3 - t * .5) * .3;
      const r = R * (1 + w * cur.amp);
      pts.push([ox + Math.cos(th) * r, oy + Math.sin(th) * r]);
    }
    ctx.beginPath();
    for (let i = 0; i < N; i++) {
      const p0 = pts[i], p1 = pts[(i + 1) % N];
      const mx = (p0[0] + p1[0]) / 2, my = (p0[1] + p1[1]) / 2;
      i === 0 ? ctx.moveTo(mx, my) : ctx.quadraticCurveTo(p0[0], p0[1], mx, my);
    }
    const pl = pts[0], pp = pts[N - 1];
    ctx.quadraticCurveTo(pp[0], pp[1], (pp[0]+pl[0])/2, (pp[1]+pl[1])/2);
    ctx.closePath();

    // halo apenas perceptible
    const halo = ctx.createRadialGradient(ox, oy, R*.6, ox, oy, R*2.2);
    halo.addColorStop(0, css(curB, .16));
    halo.addColorStop(1, css(curB, 0));
    ctx.save(); ctx.fillStyle = halo; ctx.fillRect(0, 0, W, H); ctx.restore();

    // cuerpo: gradiente cremoso, transiciones largas, sin contrastes duros
    const grad = ctx.createRadialGradient(ox - R*.3, oy - R*.35, R*.15, ox, oy, R*1.3);
    grad.addColorStop(0,   css(curA, .97));
    grad.addColorStop(.45, css(lerp3(curA, curB, .42), .96));
    grad.addColorStop(1,   css(curB, .94));
    ctx.fillStyle = grad;
    ctx.fill();

    // susurro: tipografía ligera, aparece y se va sin prisa
    const wAge = tNow - whisper.t0;
    if (whisper.text && wAge < 4) {
      let alpha = 1;
      if (wAge < .6) alpha = wAge / .6;
      else if (wAge > 2.8) alpha = Math.max(0, 1 - (wAge - 2.8) / 1.2);
      ctx.font = "300 13px 'Segoe UI', sans-serif";
      ctx.textAlign = "right";
      ctx.fillStyle = css(lerp3(curB, [255,255,255], .5), alpha * .85);
      ctx.fillText(whisper.text, W - 14, OY - R - 24);
    }

    if (!reduced) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  function setState(s, tooltip) {
    if (!STATES[s]) s = "idle";
    const changed = target !== STATES[s];
    target = STATES[s];
    canvas.title = "CodeGuard [" + s + "]" + (tooltip ? " — " + tooltip : "");
    if (changed) whisper = { text: target.whisper, t0: tNow };
  }
  setState("idle", "sin análisis todavía");

  Events.On("state", (e) => {
    const d = Array.isArray(e.data) ? e.data[0] : e.data;
    if (typeof d === "string") setState(d, "");
    else if (d) setState(d.state, d.tooltip);
  });
  Events.On("panel-show", () => { gesture = { t0: tNow, dir: 1 }; });
  Events.On("panel-hide", () => { gesture = { t0: tNow, dir: -1 }; });

  canvas.addEventListener("click", (e) => {
    if (Math.hypot(e.offsetX - OX, e.offsetY - OY) > 52) return;
    try { Events.Emit("widget-click", null); }
    catch { Events.Emit({ name: "widget-click", data: null }); }
  });
</script>
</body>
</html>
