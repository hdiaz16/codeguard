<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>CodeGuard estado</title>
<style>
  html, body {
    margin: 0; width: 100%; height: 100%; overflow: hidden;
    background: transparent; user-select: none;
  }
  canvas { display: block; cursor: pointer; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
  import { Events } from "/wails/runtime.js";

  // ── Esfera fluida (estética "Her"): un blob orgánico que ondula con
  //    armónicos suaves, respira, y funde colores entre estados. ──────────

  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");
  const DPR = window.devicePixelRatio || 1;
  let W, H;
  function resize() {
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    canvas.style.width = W + "px"; canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  resize();
  window.addEventListener("resize", resize);

  // Parámetros por estado: color interior/exterior, energía del movimiento.
  const STATES = {
    //          núcleo      borde       amp   vel   resp  latido
    idle:     { a:"#ffd9c4", b:"#e0876a", amp:.045, spd:.35, br:.05, beat:0 },
    working:  { a:"#ffe2a8", b:"#e8a13d", amp:.10,  spd:1.5, br:.03, beat:0 },
    pass:     { a:"#d2f5dd", b:"#4fbe7d", amp:.05,  spd:.5,  br:.06, beat:0 },
    blocked:  { a:"#ffc9bd", b:"#d9412e", amp:.075, spd:1.1, br:0,   beat:1 },
    degraded: { a:"#ffd9b0", b:"#dd8040", amp:.06,  spd:.7,  br:.04, beat:0 },
    offline:  { a:"#9aa4ac", b:"#535c64", amp:.015, spd:.15, br:.02, beat:0 },
  };

  let cur = { ...STATES.idle };            // parámetros vivos (interpolados)
  let curA = hex(STATES.idle.a), curB = hex(STATES.idle.b);
  let target = STATES.idle;
  let stateName = "idle";

  function hex(h) {
    return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
  }
  const lerp = (x, y, t) => x + (y - x) * t;
  const lerp3 = (u, v, t) => [lerp(u[0],v[0],t), lerp(u[1],v[1],t), lerp(u[2],v[2],t)];
  const css = (c, a=1) => `rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;

  // Fases aleatorias fijas para que cada arranque tenga su propia "personalidad".
  const ph = Array.from({length: 5}, () => Math.random() * Math.PI * 2);

  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let t = 0, last = performance.now();

  function frame(now) {
    const dt = Math.min((now - last) / 1000, .05);
    last = now;
    t += dt * cur.spd;

    // fundido suave hacia el estado objetivo (~1 s)
    const k = 1 - Math.pow(.001, dt);
    cur.amp = lerp(cur.amp, target.amp, k);
    cur.spd = lerp(cur.spd, target.spd, k);
    cur.br  = lerp(cur.br,  target.br,  k);
    cur.beat = lerp(cur.beat, target.beat, k);
    curA = lerp3(curA, hex(target.a), k);
    curB = lerp3(curB, hex(target.b), k);

    ctx.clearRect(0, 0, W, H);
    const cx = W / 2, cy = H / 2;
    let R = Math.min(W, H) * .21;

    // respiración natural + latido doble (bum-bum) cuando está bloqueado
    R *= 1 + Math.sin(t * .9 + ph[0]) * cur.br;
    if (cur.beat > .01) {
      const b = t * 2.4 % (Math.PI * 2);
      const pulse = Math.max(0, Math.sin(b)) ** 6 + .55 * Math.max(0, Math.sin(b - .9)) ** 6;
      R *= 1 + pulse * .09 * cur.beat;
    }

    // deriva sutil del centro: flota, no está clavada
    const ox = Math.sin(t * .43 + ph[1]) * R * .06;
    const oy = Math.cos(t * .31 + ph[2]) * R * .06;

    // contorno orgánico: tres armónicos lentos sobre el radio
    ctx.beginPath();
    const N = 90;
    for (let i = 0; i <= N; i++) {
      const th = (i / N) * Math.PI * 2;
      const w =
        Math.sin(th * 3 + t * 1.1 + ph[3]) * .55 +
        Math.sin(th * 5 - t * .8  + ph[4]) * .30 +
        Math.sin(th * 2 + t * .5)          * .15;
      const r = R * (1 + w * cur.amp);
      const x = cx + ox + Math.cos(th) * r;
      const y = cy + oy + Math.sin(th) * r;
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.closePath();

    // halo exterior muy suave
    const halo = ctx.createRadialGradient(cx+ox, cy+oy, R*.5, cx+ox, cy+oy, R*2.4);
    halo.addColorStop(0, css(curB, .28));
    halo.addColorStop(1, css(curB, 0));
    ctx.save();
    ctx.fillStyle = halo;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();

    // cuerpo: gradiente desplazado hacia la luz (arriba-izquierda)
    const g = ctx.createRadialGradient(
      cx+ox - R*.35, cy+oy - R*.4, R*.1,
      cx+ox, cy+oy, R*1.25);
    g.addColorStop(0, css(curA, .98));
    g.addColorStop(.55, css(lerp3(curA, curB, .55), .96));
    g.addColorStop(1, css(curB, .92));
    ctx.fillStyle = g;
    ctx.fill();

    if (!reduced) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  function setState(s, tooltip) {
    if (!STATES[s]) s = "idle";
    stateName = s;
    target = STATES[s];
    canvas.title = "CodeGuard [" + s + "]" + (tooltip ? " — " + tooltip : "");
  }
  setState("idle", "sin análisis todavía");

  Events.On("state", (e) => {
    const d = Array.isArray(e.data) ? e.data[0] : e.data;
    if (typeof d === "string") setState(d, "");
    else if (d) setState(d.state, d.tooltip);
  });

  canvas.addEventListener("click", () => {
    try { Events.Emit("widget-click", null); }
    catch { Events.Emit({ name: "widget-click", data: null }); }
  });
</script>
</body>
</html>
