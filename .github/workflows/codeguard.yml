name: CodeGuard (sombra)
on:
  pull_request:
  push:
    branches: [main, master, develop]

jobs:
  analyze:
    # Mismo SO que los devs: elimina divergencias de ruta y de finales de línea (spec §11).
    runs-on: windows-latest
    permissions:
      contents: read
      security-events: write
      # Para el comentario del PR con los hallazgos (el SARIF solo, sin
      # Advanced Security, no tiene dónde mostrarse en un repo privado).
      pull-requests: write
    steps:
      # Acciones ancladas por SHA, no por etiqueta: una etiqueta es un puntero
      # movible y quien controle el repo de la acción puede reapuntarla a otro
      # código, que correría con los secretos de este workflow. Es la regla
      # gha-action-sin-sha del propio rulepack, y bloqueó este commit hasta
      # cumplirla.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      # Fase 1: se compila del fuente. Desde la fase 2 se descargará el binario
      # firmado con la versión pinneada en config y se verificará su firma.
      - name: Construir CodeGuard
        run: go build -o codeguard.exe ./cmd/codeguard

      # Las versiones salen de motores.json, la MISMA fuente que lee el
      # instalador. Antes decia @latest, y sin version en pip: el CI instalaba
      # gitleaks@latest mientras cada maquina tenia la 8.30.0 fijada por hash.
      # O sea que la compuerta local y la del CI eran binarios distintos, y eso
      # erosiona en silencio la promesa central del producto -"si el commit pasa
      # aqui, pasa alla"- de la peor manera: intermitente, y meses despues,
      # cuando una regla cambia de comportamiento entre dos versiones.
      #
      # gitleaks se DESCARGA con su hash, no se compila. Fijar la version no
      # bastaba: `go install gitleaks@v8.30.0` en el CI y el zip oficial en las
      # maquinas dan binarios distintos -otra stdlib, otro build- con la misma
      # etiqueta. Ahora el CI corre exactamente los mismos bytes que la gente, y
      # la auditoria mide el artefacto que de verdad se reparte.
      #
      # mypy viaja junto a semgrep para que el CI tenga el MISMO juego de
      # motores que una maquina de desarrollo: si un .py con configuracion de
      # tipos entra al repo, la compuerta corre aqui igual y no aparece como
      # capa degradada por un binario ausente.
      - name: Instalar motores (versiones fijadas en motores.json)
        shell: pwsh
        run: |
          $m = Get-Content internal/engines/identidad/motores.json -Raw | ConvertFrom-Json
          $engines = "$env:LOCALAPPDATA\CodeGuard\engines"
          New-Item -ItemType Directory -Force $engines | Out-Null

          # Descargados y verificados, igual que en el instalador.
          foreach ($n in @("gitleaks", "trivy")) {
            $v = $m.motores.$n.versiones | Select-Object -Last 1
            Write-Host "descargando $n $($v.version)"
            Invoke-WebRequest -Uri $v.url -OutFile "$env:TEMP\$n.zip" -UseBasicParsing
            $h = (Get-FileHash "$env:TEMP\$n.zip" -Algorithm SHA256).Hash.ToLower()
            if ($h -ne $v.sha256_zip) {
              Write-Host "::error::el zip de $n no coincide con el checksum fijado ($h)"
              exit 1
            }
            Expand-Archive "$env:TEMP\$n.zip" "$env:TEMP\$n" -Force
            Copy-Item "$env:TEMP\$n\$n.exe" $engines -Force
          }

          # Compilados, porque en las maquinas tambien se compilan: ahi la
          # paridad es usar la misma version de modulo, no el mismo binario.
          foreach ($n in @("govulncheck", "staticcheck")) {
            $spec = $m.paquetes.go.$n
            Write-Host "go install $($spec.modulo)@$($spec.version)"
            go install "$($spec.modulo)@$($spec.version)"
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          Copy-Item "$(go env GOPATH)\bin\govulncheck.exe" $engines -Force
          Copy-Item "$(go env GOPATH)\bin\staticcheck.exe" $engines -Force

          $pins = @()
          foreach ($q in $m.paquetes.pip.PSObject.Properties) { $pins += "$($q.Name)==$($q.Value)" }
          Write-Host "pip install $($pins -join ' ')"
          pip install @pins
          if ($LASTEXITCODE -ne 0) { exit 1 }
          echo "$(go env GOPATH)/bin" >> $env:GITHUB_PATH
          echo "$engines" >> $env:GITHUB_PATH

      # Este paso SÍ tumba el job, a diferencia del análisis en sombra: una
      # regla que no compila no es un hallazgo discutible, es cobertura
      # perdida en silencio. Cinco reglas del pack (log-dato-sensible,
      # pii-en-telemetria, escrituras-sin-transaccion, anidamiento-profundo-ts,
      # cors-wildcard-con-credenciales) vivieron muertas desde su creación
      # porque nada las validaba: mezclaban sintaxis de un lenguaje en reglas
      # multi-lenguaje y semgrep las descartaba completas, aquí y en cada
      # máquina, sin que nadie lo viera.
      - name: Validar el rulepack (las reglas rotas no viajan)
        shell: pwsh
        # PYTHONUTF8: sin él, semgrep lee los YAML con la página de códigos
        # regional de Windows (cp1252) y los comentarios con acentos lo tumban
        # con UnicodeDecodeError. Es la MISMA lección que semgrep.go ya aplica
        # al invocar el motor — este paso cayó en su primera corrida por no
        # aplicarla también aquí.
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8
        run: |
          foreach ($pack in Get-ChildItem rulepacks -Directory) {
            semgrep scan --validate --config "$($pack.FullName)\semgrep" --metrics=off --disable-version-check
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }

      # --validate prueba que las reglas COMPILAN; este paso prueba que CAZAN.
      # El corpus (rulepacks/<ver>/testdata, hermano de semgrep/ porque un yaml
      # de fixture dentro del --config se parsearía como regla) anota con
      # "ruleid:" dónde debe matchear cada regla y con "ok:" dónde no. Una
      # regla que deja de cazar su propio ejemplo, o que caza el negativo, es
      # una regresión de cobertura — y las 5 reglas muertas de agosto y los 12
      # falsos positivos de log-dato-sensible habrían caído aquí, no en
      # producción. La segunda mitad exige además que NINGUNA regla viva sin
      # test: cobertura que no se exige se erosiona.
      - name: Probar el rulepack (cada regla demuestra que caza lo que promete)
        shell: pwsh
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8
        run: |
          foreach ($pack in Get-ChildItem rulepacks -Directory) {
            $tests = Join-Path $pack.FullName "testdata"
            if (-not (Test-Path $tests)) {
              Write-Host "::error::$($pack.Name) no tiene corpus de pruebas (testdata/)"
              exit 1
            }
            semgrep scan --test --config "$($pack.FullName)\semgrep" $tests --metrics=off --disable-version-check
            if ($LASTEXITCODE -ne 0) { exit 1 }

            $ids = Select-String -Path "$($pack.FullName)\semgrep\*.yaml" -Pattern '^\s*- id:\s*(\S+)' |
              ForEach-Object { $_.Matches[0].Groups[1].Value } | Sort-Object -Unique
            $conTest = Select-String -Path "$tests\*" -Pattern '(?<!todo)ruleid:\s*([\w.-]+)' -AllMatches |
              ForEach-Object { $_.Matches } | ForEach-Object { $_.Groups[1].Value } | Sort-Object -Unique
            $sinTest = @($ids | Where-Object { $_ -notin $conTest })
            if ($sinTest.Count -gt 0) {
              Write-Host "::error::reglas de $($pack.Name) sin caso positivo en el corpus: $($sinTest -join ', ')"
              exit 1
            }
            Write-Host "$($pack.Name): $($ids.Count) reglas, todas con test"
          }

      # Nos auditamos a nosotros mismos, y este paso SÍ tumba el job.
      #
      # `codeguard engines` comprueba que cada motor sea el binario que publicó
      # su autor. Esto comprueba la otra mitad: que lo que publicó su autor no
      # arrastre CVEs conocidos. Un motor puede coincidir con su hash a la
      # perfección y traer dentro una dependencia vulnerable — el hash sólo
      # prueba que nadie lo manipuló por el camino.
      #
      # Repartimos nueve binarios a las máquinas del equipo. Una herramienta que
      # exige no desplegar dependencias vulnerables y no se mira a sí misma pide
      # una confianza que no se ganó.
      # Los motores de Java se instalan AQUI aunque el CI no analice Java: si no,
      # nadie los mira nunca. En una maquina sin JDK el instalador se los salta,
      # y la auditoria los reportaba como "sin revisar" -honesto, pero el
      # resultado practico era que los dos artefactos que repartimos viajaban sin
      # que nadie les hubiera pasado un escaner jamas. El runner tiene JDK.
      - name: Auditar los motores que distribuimos (CVEs propios)
        shell: pwsh
        run: |
          $m = Get-Content internal/engines/identidad/motores.json -Raw | ConvertFrom-Json
          $engines = "$env:LOCALAPPDATA\CodeGuard\engines"
          $v = $m.motores.'google-java-format'.versiones | Select-Object -Last 1
          Invoke-WebRequest -Uri $v.url -OutFile "$engines\$($v.instalado)" -UseBasicParsing
          $h = (Get-FileHash "$engines\$($v.instalado)" -Algorithm SHA256).Hash.ToLower()
          if ($h -ne $v.sha256_zip) {
            Write-Host "::error::google-java-format no coincide con el checksum fijado ($h)"
            exit 1
          }
          $v = $m.motores.pmd.versiones | Select-Object -Last 1
          Invoke-WebRequest -Uri $v.url -OutFile "$env:TEMP\pmd.zip" -UseBasicParsing
          $h = (Get-FileHash "$env:TEMP\pmd.zip" -Algorithm SHA256).Hash.ToLower()
          if ($h -ne $v.sha256_zip) {
            Write-Host "::error::el zip de PMD no coincide con el checksum fijado ($h)"
            exit 1
          }
          Expand-Archive "$env:TEMP\pmd.zip" $engines -Force

          ./codeguard.exe engines --auditar

      # El commit base no siempre existe: en el primer push de un repo
      # github.event.before son ceros, y tras un push forzado apunta a un
      # commit que ya no está. En ambos casos `git diff base..head` falla y se
      # lleva por delante el análisis entero. Se comprueba antes de usarlo.
      - name: Determinar el commit base
        id: base
        shell: pwsh
        run: |
          $base = "${{ github.event.pull_request.base.sha }}"
          if (-not $base) { $base = "${{ github.event.before }}" }
          $existe = $false
          if ($base -and $base -notmatch '^0+$') {
            git cat-file -e "$base^{commit}" 2>$null
            $existe = ($LASTEXITCODE -eq 0)
          }
          if (-not $existe) {
            # Sin base utilizable, se compara contra el padre del commit
            # actual; si tampoco lo hay (primer commit del repo), contra el
            # árbol vacío, que equivale a "revisa todo".
            git cat-file -e "HEAD~1^{commit}" 2>$null
            if ($LASTEXITCODE -eq 0) {
              $base = git rev-parse HEAD~1
            } else {
              $base = git hash-object -t tree /dev/null
            }
            Write-Host "base no utilizable; se usa $base"
          }
          "sha=$base" >> $env:GITHUB_OUTPUT

      - name: Analizar (modo sombra — nunca falla el job)
        shell: pwsh
        # Sin credenciales de Foundry: el CI corre SOLO la capa determinista (spec §11)
        run: |
          ./codeguard.exe ci --base ${{ steps.base.outputs.sha }} --head ${{ github.sha }} --out results.sarif --shadow

      - name: ¿Se generó el SARIF?
        id: sarif
        if: always()
        shell: pwsh
        run: |
          $hay = Test-Path results.sarif
          if (-not $hay) { Write-Host "no hay results.sarif: el análisis no llegó a producirlo" }
          "existe=$($hay.ToString().ToLower())" >> $env:GITHUB_OUTPUT

      # Subir el SARIF exige code scanning habilitado; en un repo privado eso
      # requiere GitHub Advanced Security. Sin él, este paso falla y tiñe de
      # rojo un análisis que sí corrió: por eso no puede tumbar el job.
      - uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        if: always() && steps.sarif.outputs.existe == 'true'
        continue-on-error: true
        with:
          sarif_file: results.sarif

      # El SARIF sin Advanced Security no tiene superficie en un repo privado:
      # GitHub lo descarta en silencio. Este paso lo convierte en UN comentario
      # del PR que se actualiza en cada push (upsert por marcador, no un
      # comentario nuevo por corrida — el hilo del PR no es un log). En modo
      # sombra el job nunca falla; el comentario es donde el análisis se VE.
      - name: Comentar el PR con los hallazgos
        if: always() && github.event_name == 'pull_request' && steps.sarif.outputs.existe == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $sarif = Get-Content results.sarif -Raw | ConvertFrom-Json
          $res = @($sarif.runs[0].results)
          $md = [System.Collections.Generic.List[string]]::new()
          $md.Add('<!-- codeguard-informe -->')
          $md.Add('## CodeGuard — análisis del PR')
          $md.Add('')
          if ($res.Count -eq 0) {
            $md.Add('✅ Sin hallazgos en los archivos de este PR.')
          } else {
            $bloq   = @($res | Where-Object { $_.level -eq 'error' })
            $avisos = @($res | Where-Object { $_.level -ne 'error' })
            $md.Add("**$($bloq.Count) bloqueante(s) · $($avisos.Count) aviso(s)** — el CI corre en sombra (no falla el job); el hook local sí bloquea los primeros.")
            foreach ($grupo in @(,@('⛔ Bloqueantes', $bloq)) + @(,@('⚠️ Avisos', $avisos))) {
              $titulo, $lista = $grupo
              if ($lista.Count -eq 0) { continue }
              $md.Add('')
              $md.Add("### $titulo")
              $md.Add('| Regla | Dónde | Qué |')
              $md.Add('|---|---|---|')
              $tope = 30
              foreach ($r in ($lista | Select-Object -First $tope)) {
                $loc = $r.locations[0].physicalLocation
                $donde = "``$($loc.artifactLocation.uri):$($loc.region.startLine)``"
                $que = ($r.message.text -replace '\|', '\|' -replace "`n", ' ')
                if ($que.Length -gt 160) { $que = $que.Substring(0, 160) + '…' }
                $md.Add("| $($r.ruleId) | $donde | $que |")
              }
              if ($lista.Count -gt $tope) { $md.Add("| … | | y $($lista.Count - $tope) más |") }
            }
          }
          $md.Add('')
          $md.Add("_Corrida [$($env:GITHUB_RUN_ID)]($($env:GITHUB_SERVER_URL)/$($env:GITHUB_REPOSITORY)/actions/runs/$($env:GITHUB_RUN_ID)) sobre $($env:GITHUB_SHA.Substring(0,8))_")
          Set-Content -Path cuerpo-comentario.md -Value ($md -join "`n") -Encoding utf8

          $repo = "${{ github.repository }}"
          $pr = "${{ github.event.pull_request.number }}"
          $previos = gh api "repos/$repo/issues/$pr/comments" --paginate | ConvertFrom-Json
          $mio = $previos | Where-Object { $_.body -like '*<!-- codeguard-informe -->*' } | Select-Object -First 1
          if ($mio) {
            gh api -X PATCH "repos/$repo/issues/comments/$($mio.id)" -F body=@cuerpo-comentario.md | Out-Null
            Write-Host "comentario actualizado ($($res.Count) hallazgos)"
          } else {
            gh api -X POST "repos/$repo/issues/$pr/comments" -F body=@cuerpo-comentario.md | Out-Null
            Write-Host "comentario creado ($($res.Count) hallazgos)"
          }

      - name: Resumen
        if: always()
        shell: pwsh
        run: |
          if ("${{ steps.sarif.outputs.existe }}" -eq "true") {
            Write-Host "análisis completado; SARIF en results.sarif"
          } else {
            Write-Host "el análisis no produjo SARIF — revisa el paso anterior"
          }
