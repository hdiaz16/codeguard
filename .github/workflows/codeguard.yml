name: CodeGuard (sombra)
on:
  pull_request:
  push:
    branches: [main, master, develop]

jobs:
  analyze:
    # Mismo SO que los devs: elimina divergencias de ruta y de finales de línea (spec §11).
    runs-on: windows-latest
    permissions:
      contents: read
      security-events: write
    steps:
      # Acciones ancladas por SHA, no por etiqueta: una etiqueta es un puntero
      # movible y quien controle el repo de la acción puede reapuntarla a otro
      # código, que correría con los secretos de este workflow. Es la regla
      # gha-action-sin-sha del propio rulepack, y bloqueó este commit hasta
      # cumplirla.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      # Fase 1: se compila del fuente. Desde la fase 2 se descargará el binario
      # firmado con la versión pinneada en config y se verificará su firma.
      - name: Construir CodeGuard
        run: go build -o codeguard.exe ./cmd/codeguard

      - name: Instalar motores
        run: |
          go install github.com/zricethezav/gitleaks/v8@latest
          go install golang.org/x/vuln/cmd/govulncheck@latest
          pip install semgrep
          echo "$(go env GOPATH)\bin" >> $env:GITHUB_PATH

      # Este paso SÍ tumba el job, a diferencia del análisis en sombra: una
      # regla que no compila no es un hallazgo discutible, es cobertura
      # perdida en silencio. Cinco reglas del pack (log-dato-sensible,
      # pii-en-telemetria, escrituras-sin-transaccion, anidamiento-profundo-ts,
      # cors-wildcard-con-credenciales) vivieron muertas desde su creación
      # porque nada las validaba: mezclaban sintaxis de un lenguaje en reglas
      # multi-lenguaje y semgrep las descartaba completas, aquí y en cada
      # máquina, sin que nadie lo viera.
      - name: Validar el rulepack (las reglas rotas no viajan)
        shell: pwsh
        # PYTHONUTF8: sin él, semgrep lee los YAML con la página de códigos
        # regional de Windows (cp1252) y los comentarios con acentos lo tumban
        # con UnicodeDecodeError. Es la MISMA lección que semgrep.go ya aplica
        # al invocar el motor — este paso cayó en su primera corrida por no
        # aplicarla también aquí.
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8
        run: |
          foreach ($pack in Get-ChildItem rulepacks -Directory) {
            semgrep scan --validate --config "$($pack.FullName)\semgrep" --metrics=off --disable-version-check
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }

      # --validate prueba que las reglas COMPILAN; este paso prueba que CAZAN.
      # El corpus (rulepacks/<ver>/testdata, hermano de semgrep/ porque un yaml
      # de fixture dentro del --config se parsearía como regla) anota con
      # "ruleid:" dónde debe matchear cada regla y con "ok:" dónde no. Una
      # regla que deja de cazar su propio ejemplo, o que caza el negativo, es
      # una regresión de cobertura — y las 5 reglas muertas de agosto y los 12
      # falsos positivos de log-dato-sensible habrían caído aquí, no en
      # producción. La segunda mitad exige además que NINGUNA regla viva sin
      # test: cobertura que no se exige se erosiona.
      - name: Probar el rulepack (cada regla demuestra que caza lo que promete)
        shell: pwsh
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8
        run: |
          foreach ($pack in Get-ChildItem rulepacks -Directory) {
            $tests = Join-Path $pack.FullName "testdata"
            if (-not (Test-Path $tests)) {
              Write-Host "::error::$($pack.Name) no tiene corpus de pruebas (testdata/)"
              exit 1
            }
            semgrep scan --test --config "$($pack.FullName)\semgrep" $tests --metrics=off --disable-version-check
            if ($LASTEXITCODE -ne 0) { exit 1 }

            $ids = Select-String -Path "$($pack.FullName)\semgrep\*.yaml" -Pattern '^\s*- id:\s*(\S+)' |
              ForEach-Object { $_.Matches[0].Groups[1].Value } | Sort-Object -Unique
            $conTest = Select-String -Path "$tests\*" -Pattern '(?<!todo)ruleid:\s*([\w.-]+)' -AllMatches |
              ForEach-Object { $_.Matches } | ForEach-Object { $_.Groups[1].Value } | Sort-Object -Unique
            $sinTest = @($ids | Where-Object { $_ -notin $conTest })
            if ($sinTest.Count -gt 0) {
              Write-Host "::error::reglas de $($pack.Name) sin caso positivo en el corpus: $($sinTest -join ', ')"
              exit 1
            }
            Write-Host "$($pack.Name): $($ids.Count) reglas, todas con test"
          }

      # El commit base no siempre existe: en el primer push de un repo
      # github.event.before son ceros, y tras un push forzado apunta a un
      # commit que ya no está. En ambos casos `git diff base..head` falla y se
      # lleva por delante el análisis entero. Se comprueba antes de usarlo.
      - name: Determinar el commit base
        id: base
        shell: pwsh
        run: |
          $base = "${{ github.event.pull_request.base.sha }}"
          if (-not $base) { $base = "${{ github.event.before }}" }
          $existe = $false
          if ($base -and $base -notmatch '^0+$') {
            git cat-file -e "$base^{commit}" 2>$null
            $existe = ($LASTEXITCODE -eq 0)
          }
          if (-not $existe) {
            # Sin base utilizable, se compara contra el padre del commit
            # actual; si tampoco lo hay (primer commit del repo), contra el
            # árbol vacío, que equivale a "revisa todo".
            git cat-file -e "HEAD~1^{commit}" 2>$null
            if ($LASTEXITCODE -eq 0) {
              $base = git rev-parse HEAD~1
            } else {
              $base = git hash-object -t tree /dev/null
            }
            Write-Host "base no utilizable; se usa $base"
          }
          "sha=$base" >> $env:GITHUB_OUTPUT

      - name: Analizar (modo sombra — nunca falla el job)
        shell: pwsh
        # Sin credenciales de Foundry: el CI corre SOLO la capa determinista (spec §11)
        run: |
          ./codeguard.exe ci --base ${{ steps.base.outputs.sha }} --head ${{ github.sha }} --out results.sarif --shadow

      - name: ¿Se generó el SARIF?
        id: sarif
        if: always()
        shell: pwsh
        run: |
          $hay = Test-Path results.sarif
          if (-not $hay) { Write-Host "no hay results.sarif: el análisis no llegó a producirlo" }
          "existe=$($hay.ToString().ToLower())" >> $env:GITHUB_OUTPUT

      # Subir el SARIF exige code scanning habilitado; en un repo privado eso
      # requiere GitHub Advanced Security. Sin él, este paso falla y tiñe de
      # rojo un análisis que sí corrió: por eso no puede tumbar el job.
      - uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        if: always() && steps.sarif.outputs.existe == 'true'
        continue-on-error: true
        with:
          sarif_file: results.sarif

      - name: Resumen
        if: always()
        shell: pwsh
        run: |
          if ("${{ steps.sarif.outputs.existe }}" -eq "true") {
            Write-Host "análisis completado; SARIF en results.sarif"
          } else {
            Write-Host "el análisis no produjo SARIF — revisa el paso anterior"
          }
