<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>CodeGuard — explorador de código</title>
<style>
  :root {
    --d0:#101315; --d1:#171b1f; --d2:#1f252a; --d3:#2a3138;
    --ink:#e8edf1; --ink-2:#a3aeb7; --ink-3:#6f7b85;
    --pkg:#8fb8ce; --fn:#9dc4a8; --method:#c9b98f; --query:#d98a76; --hot:#e4604b;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--d0); color:var(--ink);
    font-family:"Segoe UI",system-ui,sans-serif; overflow:hidden; }
  #sigma { position:absolute; inset:0; }

  .panel {
    position:absolute; top:14px; left:14px; z-index:5; width:280px;
    background:var(--d1); border-radius:14px; padding:14px 16px;
    box-shadow:0 8px 30px rgba(0,0,0,.55); font-size:13px;
  }
  .panel h1 { font-size:14px; margin:0 0 2px; font-weight:650; letter-spacing:-.01em; }
  .panel .sub { color:var(--ink-3); font-size:11px; margin-bottom:12px; }
  .row { display:flex; align-items:center; gap:8px; margin:7px 0; }
  .row label { flex:1; color:var(--ink-2); font-size:12px; }
  input[type=range] { width:110px; accent-color:var(--pkg); }
  input[type=search] {
    width:100%; background:var(--d2); border:none; border-radius:8px;
    padding:7px 10px; color:var(--ink); font-family:inherit; font-size:12px; margin-top:4px;
  }
  input[type=search]:focus { outline:1px solid var(--pkg); }
  .chips { display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; }
  .chip {
    font-size:10.5px; padding:4px 9px; border-radius:999px; cursor:pointer;
    background:var(--d3); color:var(--ink-2); user-select:none; transition:.15s;
  }
  .chip.on { color:var(--d0); font-weight:650; }
  .chip[data-k=func].on   { background:var(--fn); }
  .chip[data-k=method].on { background:var(--method); }
  .chip[data-k=query].on  { background:var(--query); }
  .stats { color:var(--ink-3); font-size:11px; margin-top:11px; line-height:1.5; }
  .stats b { color:var(--ink); font-variant-numeric:tabular-nums; }

  /* detalle del nodo seleccionado */
  .detail {
    position:absolute; top:14px; right:14px; z-index:5; width:320px;
    background:var(--d1); border-radius:14px; padding:14px 16px;
    box-shadow:0 8px 30px rgba(0,0,0,.55); font-size:13px; display:none;
  }
  .detail.on { display:block; }
  .detail h2 { font-size:13.5px; margin:0 0 3px; font-weight:650; word-break:break-all; }
  .detail .loc { color:var(--ink-3); font-size:11px; font-family:Consolas,monospace; margin-bottom:10px; word-break:break-all; }
  .detail h3 {
    font-size:10px; text-transform:uppercase; letter-spacing:.1em; color:var(--ink-3);
    margin:12px 0 5px; font-weight:650;
  }
  .detail ul { margin:0; padding:0; list-style:none; max-height:150px; overflow-y:auto; }
  .detail li {
    font-size:11.5px; font-family:Consolas,monospace; color:var(--ink-2);
    padding:3px 7px; border-radius:5px; cursor:pointer; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis;
  }
  .detail li:hover { background:var(--d3); color:var(--ink); }
  .empty { color:var(--ink-3); font-size:11.5px; font-style:italic; }
  .hint {
    position:absolute; bottom:14px; left:50%; transform:translateX(-50%); z-index:5;
    color:var(--ink-3); font-size:11px; background:var(--d1); padding:7px 14px;
    border-radius:999px; box-shadow:0 4px 16px rgba(0,0,0,.4);
  }
  ::-webkit-scrollbar { width:7px; } ::-webkit-scrollbar-thumb { background:var(--d3); border-radius:4px; }
</style>
</head>
<body>
<div id="sigma"></div>

<div class="panel">
  <h1>Explorador de código</h1>
  <div class="sub" id="repo-name">—</div>

  <input type="search" id="search" placeholder="buscar función…" autocomplete="off">

  <div class="chips" id="kinds">
    <span class="chip on" data-k="func">funciones</span>
    <span class="chip on" data-k="method">métodos</span>
    <span class="chip on" data-k="query">consultas</span>
  </div>

  <div class="row" style="margin-top:12px">
    <label>mínimo de conexiones</label>
    <input type="range" id="mindeg" min="0" max="12" value="0">
    <b id="mindeg-v" style="font-size:11px;width:14px">0</b>
  </div>
  <div class="row">
    <label>solo el vecindario</label>
    <input type="checkbox" id="focus">
  </div>

  <div class="stats" id="stats">—</div>
</div>

<div class="detail" id="detail">
  <h2 id="d-name">—</h2>
  <div class="loc" id="d-loc">—</div>
  <h3>llama a (<span id="d-out-n">0</span>)</h3>
  <ul id="d-out"></ul>
  <h3>lo llaman (<span id="d-in-n">0</span>)</h3>
  <ul id="d-in"></ul>
</div>

<div class="hint">arrastra para mover · rueda para zoom · clic en un nodo para inspeccionarlo</div>

<script src="graphology.js"></script>
<script src="sigma.js"></script>
<script>
// ── datos inyectados por codeguard graph --deep ──
const DATA = /*__GRAPH_DATA__*/ {"nodes":[],"edges":[],"lang":"go","root":""};

const COLORS = { func:"#9dc4a8", method:"#c9b98f", query:"#d98a76" };
const g = new graphology.Graph({ type:"directed", multi:false });

// ── layout: ForceAtlas2 propio (sin dependencias externas) ──────────────────
// Repulsión con Barnes-Hut aproximado por rejilla + atracción por aristas +
// agrupamiento por paquete (los nodos del mismo paquete se atraen entre sí).
function layout(nodes, edges, iters = 320) {
  const N = nodes.length;
  const pos = new Float64Array(N * 2);
  const idx = new Map();
  nodes.forEach((n, i) => {
    idx.set(n.id, i);
    const a = (i / N) * Math.PI * 2, r = 260 + 240 * Math.random();
    pos[i*2] = Math.cos(a) * r; pos[i*2+1] = Math.sin(a) * r;
  });
  // centro por paquete, para que el grafo se lea por módulos
  const pkgs = [...new Set(nodes.map(n => n.pkg))];
  const pkgCenter = new Map();
  pkgs.forEach((p, i) => {
    const a = (i / pkgs.length) * Math.PI * 2;
    pkgCenter.set(p, [Math.cos(a) * 620, Math.sin(a) * 620]);
  });
  const E = edges.map(e => [idx.get(e.from), idx.get(e.to)]).filter(e => e[0] != null && e[1] != null);
  const deg = new Float64Array(N);
  E.forEach(([a, b]) => { deg[a]++; deg[b]++; });

  const fx = new Float64Array(N), fy = new Float64Array(N);
  for (let it = 0; it < iters; it++) {
    fx.fill(0); fy.fill(0);
    const cool = 1 - it / iters;
    // repulsión O(n²) acotada: para <2500 nodos es instantáneo en JS moderno
    for (let i = 0; i < N; i++) {
      for (let j = i + 1; j < N; j++) {
        let dx = pos[i*2] - pos[j*2], dy = pos[i*2+1] - pos[j*2+1];
        let d2 = dx*dx + dy*dy || 0.01;
        if (d2 > 900000) continue;                    // corte: lejos no se repelen
        const f = 9000 * (1 + deg[i]) * (1 + deg[j]) / d2;
        const d = Math.sqrt(d2);
        dx /= d; dy /= d;
        fx[i] += dx*f; fy[i] += dy*f; fx[j] -= dx*f; fy[j] -= dy*f;
      }
    }
    // atracción por arista
    for (const [a, b] of E) {
      const dx = pos[b*2] - pos[a*2], dy = pos[b*2+1] - pos[a*2+1];
      const d = Math.hypot(dx, dy) || 0.01;
      const f = d * 0.012;
      fx[a] += dx/d*f; fy[a] += dy/d*f; fx[b] -= dx/d*f; fy[b] -= dy/d*f;
    }
    // gravedad hacia el centro del paquete
    nodes.forEach((n, i) => {
      const c = pkgCenter.get(n.pkg);
      fx[i] += (c[0] - pos[i*2]) * 0.008;
      fy[i] += (c[1] - pos[i*2+1]) * 0.008;
    });
    for (let i = 0; i < N; i++) {
      const sp = Math.min(Math.hypot(fx[i], fy[i]), 40) * cool;
      const m = Math.hypot(fx[i], fy[i]) || 1;
      pos[i*2] += fx[i]/m*sp; pos[i*2+1] += fy[i]/m*sp;
    }
  }
  return { pos, idx };
}

const { pos, idx } = layout(DATA.nodes, DATA.edges);

DATA.nodes.forEach((n, i) => {
  g.addNode(n.id, {
    label: n.label,
    x: pos[i*2], y: pos[i*2+1],
    size: 3 + Math.min(Math.sqrt(n.calls || 0) * 2.2, 12),
    color: COLORS[n.kind] || "#8fb8ce",
    kind: n.kind, pkg: n.pkg, file: n.file, line: n.line,
  });
});
DATA.edges.forEach(e => {
  if (g.hasNode(e.from) && g.hasNode(e.to) && !g.hasEdge(e.from, e.to)) {
    g.addDirectedEdge(e.from, e.to, {
      size: e.kind === "query" ? 1.6 : 0.7,
      color: e.kind === "query" ? "rgba(217,138,118,.5)" : "rgba(120,140,160,.28)",
      kind: e.kind,
    });
  }
});

document.getElementById("repo-name").textContent =
  `${DATA.root.split("/").pop()} · ${DATA.lang} · nivel función`;

const renderer = new Sigma(g, document.getElementById("sigma"), {
  renderEdgeLabels: false,
  defaultEdgeType: "arrow",
  labelFont: "Segoe UI",
  labelSize: 11,
  labelColor: { color: "#a3aeb7" },
  labelRenderedSizeThreshold: 7,
  minCameraRatio: 0.03, maxCameraRatio: 6,
});

// ── estado de filtros ───────────────────────────────────────────────────────
const state = { kinds: new Set(["func","method","query"]), minDeg: 0, query: "", selected: null, focus: false };

function neighborhood(id) {
  const s = new Set([id]);
  g.forEachNeighbor(id, n => s.add(n));
  return s;
}

renderer.setSetting("nodeReducer", (id, data) => {
  const res = { ...data };
  const deg = g.degree(id);
  let dim = false;
  if (!state.kinds.has(data.kind)) dim = true;
  if (deg < state.minDeg) dim = true;
  if (state.query && !data.label.toLowerCase().includes(state.query)) dim = true;
  if (state.focus && state.selected) {
    if (!neighborhood(state.selected).has(id)) dim = true;
  }
  if (dim) { res.color = "#232a30"; res.label = ""; res.size = Math.min(data.size, 2.5); }
  if (id === state.selected) { res.color = "#e4604b"; res.size = data.size * 1.7; res.zIndex = 2; }
  return res;
});
renderer.setSetting("edgeReducer", (id, data) => {
  const res = { ...data };
  const [s, t] = g.extremities(id);
  const sd = renderer.getNodeDisplayData(s), td = renderer.getNodeDisplayData(t);
  if (state.selected && (s === state.selected || t === state.selected)) {
    res.color = "#e4604b"; res.size = 2.2; res.zIndex = 3;
  } else if ((sd && sd.color === "#232a30") || (td && td.color === "#232a30")) {
    res.color = "rgba(70,82,92,.12)";
  }
  return res;
});

function refresh() { renderer.refresh(); updateStats(); }

function updateStats() {
  let vis = 0;
  g.forEachNode(id => {
    const d = renderer.getNodeDisplayData(id);
    if (d && d.color !== "#232a30") vis++;
  });
  document.getElementById("stats").innerHTML =
    `<b>${g.order}</b> nodos · <b>${g.size}</b> aristas<br><b>${vis}</b> visibles con los filtros`;
}

// ── interacción ─────────────────────────────────────────────────────────────
document.getElementById("kinds").addEventListener("click", e => {
  const c = e.target.closest(".chip"); if (!c) return;
  c.classList.toggle("on");
  const k = c.dataset.k;
  state.kinds.has(k) ? state.kinds.delete(k) : state.kinds.add(k);
  refresh();
});
document.getElementById("mindeg").addEventListener("input", e => {
  state.minDeg = +e.target.value;
  document.getElementById("mindeg-v").textContent = state.minDeg;
  refresh();
});
document.getElementById("search").addEventListener("input", e => {
  state.query = e.target.value.trim().toLowerCase();
  refresh();
});
document.getElementById("focus").addEventListener("change", e => {
  state.focus = e.target.checked; refresh();
});

function select(id) {
  state.selected = id;
  const d = g.getNodeAttributes(id);
  const det = document.getElementById("detail");
  det.classList.add("on");
  document.getElementById("d-name").textContent = id;
  document.getElementById("d-loc").textContent = `${d.file}:${d.line}`;
  const out = [], inn = [];
  g.forEachOutNeighbor(id, n => out.push(n));
  g.forEachInNeighbor(id, n => inn.push(n));
  const fill = (ul, arr) => {
    ul.innerHTML = arr.length
      ? arr.sort().map(n => `<li data-id="${n}">${n}</li>`).join("")
      : `<li class="empty">— nadie —</li>`;
  };
  fill(document.getElementById("d-out"), out);
  fill(document.getElementById("d-in"), inn);
  document.getElementById("d-out-n").textContent = out.length;
  document.getElementById("d-in-n").textContent = inn.length;
  refresh();
}

renderer.on("clickNode", ({ node }) => select(node));
renderer.on("clickStage", () => {
  state.selected = null;
  document.getElementById("detail").classList.remove("on");
  refresh();
});
document.getElementById("detail").addEventListener("click", e => {
  const li = e.target.closest("li[data-id]"); if (!li) return;
  select(li.dataset.id);
  const p = renderer.getNodeDisplayData(li.dataset.id);
  if (p) renderer.getCamera().animate({ x: p.x, y: p.y, ratio: 0.4 }, { duration: 400 });
});

updateStats();
</script>
</body>
</html>
